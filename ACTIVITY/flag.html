<!DOCTYPE html>
<html>
<head>
    <title>Indian Flag</title>

    <style>
        .flag {
            width: 600px;
            height: 400px;
            border: 1px solid black;
        }

        .saffron {
            height: 133px;
            background: orange;
        }

        .white {
            height: 134px;
            background: white;
            position: relative;
        }

        .green {
            height: 133px;
            background: green;
        }

        .chakra {
            width: 90px;
            height: 90px;
            border: 5px solid navy;
            border-radius: 50%;
            position: absolute;
            left: 250px;
            top: 17px;
        }
    </style>
</head>

<body>

    <h2>Indian National Flag</h2>

    <div class="flag">
        <div class="saffron"></div>
        <div class="white">
            <div class="chakra"></div>
        </div>
        <div class="green"></div>
    </div>

</body>
</html>
