<title>Glowbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar; salon directory grid; booking wizard = steps + summary rail; dashboard and staff panel use tabs over cards. One column on phones.
   Palette: jade accent on cool sage paper, deep green ink, gold for pending and ratings, rose for no-shows. Type: Syne for headings, Figtree for text. */
:root{
  --bg:#F3F6F4;--surface:#FFFFFF;--tint:#E7EFEB;--ink:#16251F;--muted:#587067;--line:#D5E0DA;
  --accent:#1B6A55;--accent-ink:#FFFFFF;--accent-soft:#D7EBE3;
  --gold:#8A5A12;--gold-soft:#F7E8CC;--rose:#9C3D54;--rose-soft:#F6DFE4;--bad:#B42318;--bad-soft:#FBE0DD;
  --shadow:0 1px 2px rgba(20,50,40,.06),0 10px 28px rgba(20,50,40,.08);
  --font-display:'Syne','Trebuchet MS',sans-serif;--font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1814;--surface:#16231E;--tint:#1E2F28;--ink:#E6F1EC;--muted:#A5BDB3;--line:#2B403A;
  --accent:#5CC3A4;--accent-ink:#06241B;--accent-soft:#1F3D33;
  --gold:#EBC06E;--gold-soft:#3D3012;--rose:#F29BAE;--rose-soft:#46222B;--bad:#FF9A8F;--bad-soft:#4A1E1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1814;--surface:#16231E;--tint:#1E2F28;--ink:#E6F1EC;--muted:#A5BDB3;--line:#2B403A;
  --accent:#5CC3A4;--accent-ink:#06241B;--accent-soft:#1F3D33;
  --gold:#EBC06E;--gold-soft:#3D3012;--rose:#F29BAE;--rose-soft:#46222B;--bad:#FF9A8F;--bad-soft:#4A1E1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-body);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5.2vw,46px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(20px,3.2vw,26px);font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.sm-text{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 20px;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font:800 22px var(--font-display);letter-spacing:-.02em}
.brand svg{color:var(--accent)}
.nav{display:flex;flex-wrap:wrap;gap:2px}
.nl{background:none;border:0;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nl:hover{background:var(--tint)}
.nl.on{color:var(--accent);font-weight:700}
.badge{background:var(--gold);color:var(--bg);border-radius:999px;font-size:11px;font-weight:700;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 5px}
main{padding-top:28px;display:flex;flex-direction:column;gap:24px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-height:42px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
label.f>input,label.f>select,label.f>textarea{font-weight:400;color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.err{color:var(--bad);font-size:14px;font-weight:500}
.err:empty{display:none}
.notice{background:var(--gold-soft);color:var(--gold);padding:10px 14px;border-radius:8px;font-weight:500}
.hint{background:var(--tint);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.hint code{font-weight:700;color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* directory */
.intro{display:flex;flex-direction:column;gap:10px;max-width:660px}
.intro p{color:var(--muted);font-size:16px}
.fbar{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.salon{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.emb{--h:160;aspect-ratio:16/6;display:grid;place-items:center;font:800 38px var(--font-display);letter-spacing:.02em;background:color-mix(in srgb,hsl(var(--h) 55% 50%) 22%,var(--surface));color:color-mix(in srgb,hsl(var(--h) 60% 42%) 75%,var(--ink))}
.salon-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.alt{background:var(--tint);color:var(--muted)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.by{color:var(--muted);font-size:13px}
.salon-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px}
.price{font:700 18px var(--font-display);font-variant-numeric:tabular-nums}
.price span{font:400 12px var(--font-body);color:var(--muted)}

/* salon page */
.shead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.svc{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.svc:last-child{border-bottom:0}
.svc .grow{min-width:0;display:flex;flex-direction:column;gap:2px}
.avatar{--h:160;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--font-display);flex:none;background:color-mix(in srgb,hsl(var(--h) 55% 50%) 25%,var(--surface));color:color-mix(in srgb,hsl(var(--h) 60% 40%) 75%,var(--ink))}
.person{display:flex;gap:14px;align-items:flex-start}
.person .grow{min-width:0;display:flex;flex-direction:column;gap:6px}
.rev{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border-bottom:0}

/* booking wizard */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps li{border-top:4px solid var(--line);padding-top:6px;font-size:13px;font-weight:700;color:var(--muted)}
.steps li.done{border-color:var(--accent);color:var(--ink)}
.steps li.now{border-color:var(--accent);color:var(--accent)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt input{margin-top:4px}
.sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sum .tot{border-top:1px solid var(--line);padding-top:10px;font-weight:700;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
.cal .day{aspect-ratio:1;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;padding:0}
.cal .day small{font-size:10px;color:var(--muted);line-height:1}
.cal .day.free{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal .day.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cal .day.sel small{color:var(--accent-ink)}
.cal .day:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line)}
.cal .blank{visibility:hidden}
.cal .day.has{background:var(--accent-soft)}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--gold)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.slot:hover{background:var(--accent-soft)}
.slot.sel{background:var(--accent);color:var(--accent-ink)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pay-opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-weight:500;cursor:pointer}
.pay-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* cards, pills, tabs */
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 11px;white-space:nowrap}
.s-Confirmed{background:var(--accent-soft);color:var(--accent)}
.s-Pending{background:var(--gold-soft);color:var(--gold)}
.s-Completed{background:var(--tint);color:var(--muted)}
.s-Cancelled{background:var(--bad-soft);color:var(--bad)}
.s-No-show{background:var(--rose-soft);color:var(--rose)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer}
.tab.on{color:var(--accent);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:start;min-width:0}
.when{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--tint);border-radius:10px;padding:8px 4px;font-variant-numeric:tabular-nums;text-align:center}
.when b{font:800 22px var(--font-display);line-height:1}
.when span{font-size:12px;color:var(--muted);font-weight:700}
.card .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.card .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:120px}
.card .acts>*{width:100%}
.cd{font-variant-numeric:tabular-nums;font-weight:700}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.row .grow{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:flex;flex-wrap:wrap;gap:10px 0}
.stats div{padding:0 22px 0 0;margin-right:22px;border-right:1px solid var(--line)}
.stats div:last-child{border:0;margin:0}
.stats b{display:block;font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:8px;border-radius:99px;background:var(--gold)}
.bar span.t{background:var(--tint);border-radius:99px;display:block}
.auth{max-width:440px;margin:0 auto;width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--tint);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:7px;padding:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
details.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.msg summary{cursor:pointer;font-weight:700;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
pre.mail{white-space:pre-wrap;word-break:break-word;background:var(--tint);border-radius:10px;padding:14px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:8px 0 0;max-height:46vh;overflow:auto}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}

/* modal + toast */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,20,16,.6);display:grid;place-items:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:640px;padding:20px;display:flex;flex-direction:column;gap:16px;outline:0;min-width:0}
.dialog.narrow{max-width:500px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{background:var(--tint);border:0;border-radius:8px;width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer;flex:none}
#toast-root{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);max-width:480px}
.toast.warn{background:var(--gold-soft);color:var(--gold)}

@media (max-width:860px){
  .wiz{grid-template-columns:minmax(0,1fr)}
  .sum{position:static}
  .two{grid-template-columns:minmax(0,1fr)}
  .shead{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .card{grid-template-columns:76px minmax(0,1fr)}
  .card .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
  .card .acts>*{width:auto;flex:1 1 110px}
  .steps li{font-size:11.5px}
  .stats div{padding-right:14px;margin-right:14px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const LS_KEY='glowbook.v1';
const CATS=['Hair','Skin','Makeup','Nails','Brows & Waxing','Bridal'];
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const STEP=30,LEAD=60,HORIZON=60,RESCHED_HRS=4;
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n).toLocaleString('en-IN');
const pad=n=>String(n).padStart(2,'0');
const ymd=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const today=()=>{const d=new Date();return ymd(d.getFullYear(),d.getMonth(),d.getDate())};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d.getFullYear(),d.getMonth(),d.getDate())};
const dowOf=s=>new Date(s+'T00:00:00').getDay();
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const fmtT=m=>{const h=Math.floor(m/60),mm=m%60;return (h%12||12)+':'+pad(mm)+' '+(h>=12?'PM':'AM')};
const fmtD=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const fmtDY=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtDT=iso=>new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const fmtDur=m=>m>=60?Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':''):m+' min';
const startMs=a=>new Date(a.date+'T00:00:00').getTime()+a.start*60000;
const endMs=a=>startMs(a)+a.dur*60000;
const uid=p=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const initials=n=>n.split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const stars=n=>{const r=Math.round(n);return '<span class="stars" role="img" aria-label="'+(+n).toFixed(1)+' out of 5">'+'★'.repeat(r)+'☆'.repeat(5-r)+'</span>'};
const statusKey=s=>s==='Pending payment'?'Pending':s.replace(' ','-');

async function hash(s){
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('glow:'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;const t='glow:'+s;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16);
}

/* ---------- seed data ---------- */
const CAT=[
['hc','Haircut & styling','Hair',45,550,'Consultation, wash, cut and finish.'],
['bd','Blow-dry','Hair',30,350,'Wash and a smooth, bouncy blow-dry.'],
['hs','Hair spa','Hair',60,950,'Deep conditioning with a relaxing scalp massage.'],
['hcol','Global hair colour','Hair',120,2800,'Ammonia-free colour with toner and wash.'],
['kr','Keratin smoothing','Hair',150,4500,'Frizz-control smoothing. Long hair may cost more.'],
['fc','Classic facial','Skin',60,1100,'Cleansing, scrub, massage and a mask for your skin type.'],
['cu','Clean-up','Skin',30,600,'Quick refresh: cleanse, steam and extraction.'],

/* ---------- availability engine ---------- */
function holds(a){return a.status!=='Cancelled'&&!(a.status==='Pending payment'&&new Date(a.payBy)<=new Date())}
function stylistDay(p,s,date){
  const dw=dowOf(date);if(!s.days.includes(dw)||p.closed.includes(dw))return null;
  const o=Math.max(s.from,p.open),c=Math.min(s.to,p.close);return o<c?[o,c]:null;
}
function busyOf(p,s,date,exclude){
  const out=[];
  db.appts.forEach(a=>{if(a.parlourId===p.id&&a.stylistId===s.id&&a.date===date&&a.id!==exclude&&holds(a))out.push({from:a.start,to:a.start+a.dur})});
  p.blocks.forEach(b=>{if(b.date===date&&(!b.stylistId||b.stylistId===s.id))out.push({from:b.from,to:b.to})});
  return out;
}
function freeSlots(p,s,date,dur,exclude){
  const w=stylistDay(p,s,date);if(!w||date<today())return[];
  const busy=busyOf(p,s,date,exclude),out=[],isToday=date===today();
  for(let t=w[0];t+dur<=w[1];t+=STEP){
    if(isToday&&t<nowMin()+LEAD)continue;
    if(!busy.some(i=>t<i.to&&t+dur>i.from))out.push(t);
  }
  return out;
}
function slotsFor(p,date,dur,ids,exclude){
  const map={};
  ids.forEach(id=>{const s=styOf(p,id);if(s)freeSlots(p,s,date,dur,exclude).forEach(t=>{(map[t]=map[t]||[]).push(id)})});
  return Object.keys(map).map(Number).sort((a,b)=>a-b).map(t=>({t:t,ids:map[t]}));
}
function eligible(p,sv){const cats=Array.from(new Set(sv.map(s=>s.cat)));return p.stylists.filter(st=>cats.every(c=>st.skills.includes(c)))}
function pickStylist(p,date,ids){
  return ids.slice().sort((a,b)=>db.appts.filter(x=>x.stylistId===a&&x.date===date&&holds(x)).length-db.appts.filter(x=>x.stylistId===b&&x.date===date&&holds(x)).length)[0];
}

function sweep(){
  let changed=false;const now=Date.now();
  db.appts.forEach(a=>{
    if(a.status==='Pending payment'&&new Date(a.payBy).getTime()<=now){
      const p=parlour(a.parlourId);a.status='Cancelled';a.history.push({at:new Date().toISOString(),text:'Cancelled automatically: payment not received in time'});
      if(a.userId)notify(a,p,'Your booking was cancelled','Hi '+a.customer.name.split(' ')[0]+', we did not receive payment for booking '+a.id+' at '+p.name+' in time, so the slot was released. You can book again any time.');
      changed=true;
    }else if(a.status==='Confirmed'&&endMs(a)<=now){a.status='Completed';changed=true}
  });
  if(changed)save();
  return changed;
}

/* ---------- booking wizard ---------- */
function startBooking(pid,svc,sty){
  const d=new Date();
  ui.b={pid:pid,svc:svc?[svc]:[],sty:sty||'any',date:null,t:null,y:d.getFullYear(),m:d.getMonth(),step:svc?(sty?3:2):1,choice:'deposit',method:'card'};
  if(svc&&sty)ui.b.step=3;else if(sty&&!svc)ui.b.step=1;
  go('book');
}
function bookCtx(){
  const b=ui.b,p=parlour(b.pid),sv=b.svc.map(id=>svcOf(p,id)).filter(Boolean);
  const dur=sv.reduce((s,x)=>s+x.mins,0),total=sv.reduce((s,x)=>s+x.price,0),el=eligible(p,sv);
  const ids=b.sty==='any'?el.map(s=>s.id):(el.some(s=>s.id===b.sty)?[b.sty]:[]);
  return {kind:'b',p:p,sv:sv,dur:dur,total:total,el:el,ids:ids,y:b.y,m:b.m,date:b.date,t:b.t,exclude:null};
}
function rsCtx(){
  const r=ui.rs,a=db.appts.find(x=>x.id===r.id),p=parlour(a.parlourId);
  return {kind:'rs',p:p,dur:a.dur,ids:[a.stylistId],y:r.y,m:r.m,date:r.date,t:r.t,exclude:a.id,a:a};
}
function calendarHtml(c){
  const first=new Date(c.y,c.m,1),dim=new Date(c.y,c.m+1,0).getDate(),now=new Date();
  const canPrev=c.y>now.getFullYear()||(c.y===now.getFullYear()&&c.m>now.getMonth());
  const maxDate=addDays(HORIZON),td=today();
  let cells='';
  DAYN.forEach(d=>cells+='<div class="dh">'+d.charAt(0)+'</div>');
  for(let i=0;i<first.getDay();i++)cells+='<div class="blank"></div>';
  for(let d=1;d<=dim;d++){
    const date=ymd(c.y,c.m,d);let n=0;
    if(date>=td&&date<=maxDate&&c.ids.length)n=slotsFor(c.p,date,c.dur,c.ids,c.exclude).length;
    cells+='<button class="day'+(n?' free':'')+(c.date===date?' sel':'')+(date===td?' today':'')+'" data-act="'+c.kind+'-day" data-date="'+date+'"'+(n?'':' disabled')+' aria-label="'+fmtD(date)+(n?', '+n+' times free':', no times')+'">'+d+(n?'<small>'+n+' free</small>':'')+'</button>';
  }
  return '<div class="mhead"><button class="btn ghost sm" data-act="cal-nav" data-k="'+c.kind+'" data-d="-1"'+(canPrev?'':' disabled')+' aria-label="Previous month">&larr;</button><strong>'+first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</strong><button class="btn ghost sm" data-act="cal-nav" data-k="'+c.kind+'" data-d="1" aria-label="Next month">&rarr;</button></div><div class="cal">'+cells+'</div>';
}
function slotsHtml(c){
  if(!c.date)return '<p class="muted">Pick a highlighted day to see the free times.</p>';
  const sl=slotsFor(c.p,c.date,c.dur,c.ids,c.exclude);
  if(!sl.length)return '<p class="muted">No free times on '+fmtD(c.date)+'. Try another day.</p>';
  return '<div><div class="eyebrow" style="margin-bottom:8px">Free times on '+fmtD(c.date)+'</div><div class="slots">'+sl.map(s=>'<button class="slot'+(c.t===s.t?' sel':'')+'" data-act="'+c.kind+'-slot" data-t="'+s.t+'">'+fmtT(s.t)+'</button>').join('')+'</div></div>';
}
function bookSummary(){
  const c=bookCtx(),b=ui.b,p=c.p;

  '<dl class="tot"><dt>Total</dt><dd>'+money(c.total)+'</dd></dl>'+(c.total?'<p class="muted sm-text">'+(p.pay.require==='full'?'This salon asks for full payment when you book.':'Pay '+money(dep)+' ('+p.pay.pct+'%) now, the rest at the salon.')+'</p>':'');
}
function viewBook(){

    h='<h2>Choose your services</h2><p class="muted">Pick one or more. The time needed adds up.</p>'+CATS.map(cat=>{const l=p.services.filter(s=>s.on&&s.cat===cat);return l.length?'<div class="stack" style="gap:8px"><div class="eyebrow">'+esc(cat)+'</div>'+l.map(s=>'<label class="opt"><input type="checkbox" name="bsvc" value="'+s.id+'"'+(b.svc.indexOf(s.id)>-1?' checked':'')+'><span class="grow"><strong>'+esc(s.name)+'</strong><span class="muted sm-text">'+fmtDur(s.mins)+' · '+esc(s.desc)+'</span></span><b>'+money(s.price)+'</b></label>').join('')+'</div>':''}).join('')+'<p class="err" id="bk-err" role="alert"></p><div><button class="btn" data-act="b-next">Continue</button></div>';
  }else if(b.step===2){
    h='<h2>Choose your stylist</h2>';
    if(!c.el.length)h+='<div class="notice">No single stylist here covers all of these services together. Go back and book them as separate appointments.</div>';
    else h+='<label class="opt"><input type="radio" name="bsty" value="any"'+(b.sty==='any'?' checked':'')+'><span class="grow"><strong>Any available stylist</strong><span class="muted sm-text">Gives you the most time choices.</span></span></label>'+c.el.map(s=>'<label class="opt"><input type="radio" name="bsty" value="'+s.id+'"'+(b.sty===s.id?' checked':'')+'><span class="avatar" style="--h:'+s.hue+';width:42px;height:42px;font-size:15px" aria-hidden="true">'+esc(initials(s.name))+'</span><span class="grow"><strong>'+esc(s.name)+'</strong><span class="muted sm-text">'+esc(s.role)+' · works '+s.days.map(d=>DAYN[d]).join(', ')+'</span></span></label>').join('');
    h+='<p class="err" id="bk-err" role="alert"></p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-act="b-back">Back</button><button class="btn" data-act="b-next"'+(c.el.length?'':' disabled')+'>Continue</button></div>';
  }else if(b.step===3){
    h='<h2>Pick a date and time</h2><p class="muted">Times are live. They already skip booked slots and blocked hours.</p>'+calendarHtml(c)+'<div id="bk-slots">'+slotsHtml(c)+'</div><p class="err" id="bk-err" role="alert"></p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-act="b-back">Back</button><button class="btn" data-act="b-next">Continue</button></div>';
  }else h=payStepHtml(c);
  return h;
}
function payStepHtml(c){
  const b=ui.b,p=c.p,u=currentUser(),dep=depositOf(p,c.total);
  if(isAdmin())return '<h2>Review and pay</h2><div class="notice">You are signed in as salon staff. Log out and sign in as a customer to book here, or use Add reservation in the salon panel.</div><div><button class="btn ghost" data-act="b-back">Back</button></div>';
  if(!u)return '<h2>Review and pay</h2><p class="muted">Log in or create an account to confirm your booking. Your choices are kept.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="go-login" data-mode="login">Log in</button><button class="btn ghost" data-act="go-login" data-mode="register">Create account</button><button class="btn ghost" data-act="b-back">Back</button></div>';
  const full=p.pay.require==='full';
  return '<h2>Review and pay</h2><div class="hint"><b>'+fmtDY(b.date)+', '+fmtT(b.t)+' to '+fmtT(b.t+c.dur)+'</b><br>'+c.sv.map(s=>esc(s.name)).join(', ')+' at '+esc(p.name)+'</div>'+
  (full?'<div class="notice">'+esc(p.name)+' asks for full payment: '+money(c.total)+'.</div>':'<div class="stack" style="gap:8px"><div class="eyebrow">How much to pay now</div><label class="pay-opt"><input type="radio" name="bpay" value="deposit"'+(b.choice!=='full'?' checked':'')+'> Deposit '+money(dep)+' ('+p.pay.pct+'%), rest at the salon</label><label class="pay-opt"><input type="radio" name="bpay" value="full"'+(b.choice==='full'?' checked':'')+'> Pay in full '+money(c.total)+'</label></div>')+
  '<div class="eyebrow">Payment method</div>'+payFieldsHtml(p,b.method)+
  '<p class="muted sm-text">Free cancellation up to '+p.pay.freeHrs+' hours before. After that the '+p.pay.pct+'% deposit is kept. Reschedule free up to '+RESCHED_HRS+' hours before.</p><p class="err" id="bk-err" role="alert"></p>'+
  '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-act="b-back">Back</button><button class="btn" id="bk-pay" data-act="b-pay">Pay and confirm</button><button class="btn ghost" data-act="b-hold">Hold my slot for '+p.pay.hold+' min</button></div>';
}
function redrawBook(){const e=$('#bk-body');if(e)e.innerHTML=bookBody();const s=$('#bk-sum');if(s)s.innerHTML=bookSummary()}

/* shared payment fields */
function payFieldsHtml(p,m){
  const mt=p.pay.methods,opts=[['card','Card (Stripe)'],['paypal','PayPal'],['upi','UPI']].filter(o=>mt[o[0]]);
  if(!opts.length)return '<div class="notice">This salon has no online payment method turned on. Please call '+esc(p.phone)+' to book.</div>';
  if(!opts.some(o=>o[0]===m))m=opts[0][0];
  return '<div class="stack" style="gap:10px">'+opts.map(o=>'<label class="pay-opt"><input type="radio" name="pfm" value="'+o[0]+'"'+(m===o[0]?' checked':'')+'> '+o[1]+'</label>').join('')+
  '<div id="pf-card"'+(m==='card'?'':' hidden')+' class="stack" style="gap:10px"><div class="hint">Test mode, no money moves. Use <code>4242 4242 4242 4242</code>, any future expiry and any 3 digits. <button type="button" class="link" data-act="fill-card">Fill test card</button></div><label class="f">Card number<input id="pf-cardno" inputmode="numeric" autocomplete="off" maxlength="19" placeholder="1234 5678 9012 3456"></label><label class="f">Name on card<input id="pf-cardname" autocomplete="off"></label><div class="row2"><label class="f">Expiry (MM/YY)<input id="pf-cardexp" inputmode="numeric" maxlength="5" placeholder="08/29" autocomplete="off"></label><label class="f">CVV<input id="pf-cardcvv" type="password" inputmode="numeric" maxlength="3" autocomplete="off"></label></div></div>'+
  '<div id="pf-paypal"'+(m==='paypal'?'':' hidden')+'><label class="f">PayPal email<input id="pf-ppmail" type="email" autocomplete="off" placeholder="you@example.com"></label><p class="muted sm-text" style="margin-top:6px">The live version would send you to PayPal to approve this payment.</p></div>'+
  '<div id="pf-upi"'+(m==='upi'?'':' hidden')+'><label class="f">UPI ID<input id="pf-upiid" autocomplete="off" placeholder="name@bank"></label></div></div>';
}
function luhn(s){let sum=0,alt=false;for(let i=s.length-1;i>=0;i--){let n=+s[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}return sum%10===0}
function readPay(){
  const sel=$('input[name=pfm]:checked');if(!sel)return{err:'Choose a payment method.'};
  const v=id=>($('#'+id)||{value:''}).value.trim();
  if(sel.value==='upi'){if(!/^[\w.\-]{2,}@[a-z]{2,}$/i.test(v('pf-upiid')))return{err:'Enter a valid UPI ID, for example name@bank.'};return{method:'UPI',ref:'UPI'+Math.floor(1e8+Math.random()*9e8)}}
  if(sel.value==='paypal'){if(!/^\S+@\S+\.\S+$/.test(v('pf-ppmail')))return{err:'Enter the email of your PayPal account.'};return{method:'PayPal',ref:'PayPal '+v('pf-ppmail')}}
  const d=v('pf-cardno').replace(/\s/g,'');
  if(!/^\d{16}$/.test(d)||!luhn(d))return{err:'That card number is not valid. Check the 16 digits.'};
  if(!v('pf-cardname'))return{err:'Enter the name on the card.'};
  const mm=v('pf-cardexp').match(/^(\d{2})\/(\d{2})$/);if(!mm||+mm[1]<1||+mm[1]>12)return{err:'Enter the expiry as MM/YY.'};
  const n=new Date(),ey=2000+ +mm[2],em=+mm[1];if(ey<n.getFullYear()||(ey===n.getFullYear()&&em<n.getMonth()+1))return{err:'This card has expired.'};
  if(!/^\d{3}$/.test(v('pf-cardcvv')))return{err:'Enter the 3-digit CVV.'};
  return{method:'Card',ref:'Stripe •••• '+d.slice(-4)};
}
async function confirmBooking(mode,btn){
  const err=$('#bk-err'),u=currentUser(),c=bookCtx(),b=ui.b,p=c.p;err.textContent='';
  if(!u||!c.sv.length||!b.date||b.t==null)return;
  const fail=m=>{err.textContent=m;err.scrollIntoView({block:'center'})};
  sweep();
  const sl=slotsFor(p,b.date,c.dur,c.ids,null).find(s=>s.t===b.t);
  if(!sl){fail('Sorry, that time was just taken. Please pick another time.');b.t=null;b.step=3;setTimeout(redrawBook,1200);return}
  let pay=null;
  if(mode==='pay'){pay=readPay();if(pay.err)return fail(pay.err)}
  const due=p.pay.require==='full'||b.choice==='full'?c.total:depositOf(p,c.total);
  btn.disabled=true;if(mode==='pay')btn.textContent='Processing payment…';
  if(mode==='pay')await new Promise(r=>setTimeout(r,1200));
  const sty=pickStylist(p,b.date,sl.ids);
  const a=mkAppt(p,{userId:u.id,customer:{name:u.name,phone:u.phone,email:u.email},svc:b.svc,sty:sty,date:b.date,start:b.t,status:mode==='pay'?'Confirmed':'Pending payment',paid:mode==='pay'?due:0,method:pay?pay.method:'',ref:pay?pay.ref:'',payBy:mode==='hold'?new Date(Date.now()+p.pay.hold*60000).toISOString():null});
  a.dueNow=due;db.appts.push(a);
  if(mode==='pay'){addMsg({userId:u.id,parlourId:p.id,apptId:a.id,kind:'Confirmation email',to:u.email,subject:'Appointment confirmed at '+p.name,body:confBody(a,p)});scheduleReminders(a,p)}
  else addMsg({userId:u.id,parlourId:p.id,apptId:a.id,kind:'Email',to:u.email,subject:'Slot held: pay within '+p.pay.hold+' minutes',body:'Hi '+u.name.split(' ')[0]+', we are holding '+fmtDY(a.date)+' at '+fmtT(a.start)+' at '+p.name+' for you. Pay '+money(due)+' from My bookings within '+p.pay.hold+' minutes or the slot is released automatically.'});
  ui.b=null;ui.dTab='upcoming';save();refreshHeader();
  openModal('<div class="dhead"><h2>'+(mode==='pay'?'You are booked':'Slot held')+'</h2><button class="x" data-act="close" aria-label="Close">×</button></div><p>'+(mode==='pay'?'Booking '+a.id+' is confirmed for '+fmtD(a.date)+' at '+fmtT(a.start)+' with '+esc(a.stylistName)+'. Paid '+money(a.paid)+(a.total>a.paid?', balance '+money(a.total-a.paid)+' at the salon.':'.'):'Pay '+money(due)+' within '+p.pay.hold+' minutes from My bookings to keep '+fmtD(a.date)+' at '+fmtT(a.start)+'.')+'</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="close">Done</button>'+(mode==='pay'?'<button class="btn ghost" data-act="show-mail" data-id="'+a.id+'">View confirmation email</button>':'')+'</div>','narrow');
  go('my-bookings');
}

/* ---------- customer dashboard ---------- */
function payLine(a){
  if(a.status==='Pending payment')return '<span class="pill s-Pending">Pay '+money(a.dueNow)+' to confirm</span>';
  const bal=a.total-a.paid;return 'Paid '+money(a.paid)+' of '+money(a.total)+(bal>0&&a.status!=='Cancelled'?' · '+money(bal)+' due at the salon':'');
}
function apptCard(a,mode){
  const p=parlour(a.parlourId);if(!p)return '';
  const d=new Date(a.date+'T00:00:00'),k=statusKey(a.status);
  let acts='';
  if(mode==='up'){
    if(a.status==='Pending payment')acts+='<button class="btn sm" data-act="pay-now" data-id="'+a.id+'">Pay now</button>';
    acts+='<button class="btn ghost sm" data-act="rs-open" data-id="'+a.id+'">Reschedule</button>'+(ui.confirm==='c-'+a.id?'<button class="btn danger sm" data-act="cancel-go" data-id="'+a.id+'">Confirm cancel</button>':'<button class="btn danger sm" data-act="cancel-ask" data-id="'+a.id+'">Cancel</button>');
  }else{
    if(a.status==='Completed'&&!a.fbId&&a.userId)acts+='<button class="btn sm" data-act="fb-open" data-id="'+a.id+'">Leave feedback</button>';
    acts+='<button class="btn ghost sm" data-act="book-again" data-id="'+a.id+'">Book again</button>';
  }
  return '<article class="card"><div class="when"><span>'+d.toLocaleDateString('en-IN',{month:'short'}).toUpperCase()+'</span><b>'+d.getDate()+'</b><span>'+fmtT(a.start)+'</span></div><div class="body"><div class="toolbar" style="justify-content:flex-start;gap:8px"><strong>'+esc(p.name)+'</strong><span class="pill s-'+k+'">'+esc(a.status)+'</span>'+(a.sample?'<span class="tag alt">Sample</span>':'')+'</div><span>'+a.svc.map(s=>esc(s.name)).join(', ')+'</span><span class="muted sm-text">with '+esc(a.stylistName)+' · '+fmtDur(a.dur)+' · '+esc(p.area)+', '+esc(p.city)+'</span><span class="sm-text">'+payLine(a)+'</span>'+(a.status==='Pending payment'?'<span class="sm-text">Slot is held for <span class="cd" data-cd="'+a.payBy+'"></span>, then it is cancelled automatically.</span>':'')+(ui.confirm==='c-'+a.id?'<span class="sm-text" style="color:var(--bad)">'+cancelPolicy(a,p).text+'</span>':'')+'</div><div class="acts">'+acts+'</div></article>';
}
function cancelPolicy(a,p){
  const hrs=(startMs(a)-Date.now())/36e5;
  if(a.paid<=0)return{refund:0,text:'Nothing has been paid, so there is nothing to refund.'};
  if(hrs>=p.pay.freeHrs)return{refund:a.paid,text:'You will be refunded '+money(a.paid)+'. Tap Confirm cancel to go ahead.'};
  const fee=Math.min(a.paid,depositOf(p,a.total));
  return{refund:a.paid-fee,text:'This is within '+p.pay.freeHrs+' hours of the visit, so '+money(fee)+' is kept. Refund: '+money(a.paid-fee)+'. Tap Confirm cancel to go ahead.'};
}
function viewMyBookings(){
  const u=currentUser();if(!u)return '';
  const mine=db.appts.filter(a=>a.userId===u.id);

async function onLogin(f){
  const fd=new FormData(f),id=String(fd.get('id')).trim().toLowerCase(),ph=await hash(String(fd.get('pw')));
  if(ui.authRole==='admin'){
    if((id==='manager'||id==='staff')&&db.staff[id]===ph){db.session={role:'admin',level:id};save();ui.notice='';ui.ap=ui.ap||db.parlours[0].id;toast('Signed in as '+id);go('admin')}
    else showErr(f,'Username or password is wrong.');return;
  }
  const u=db.users.find(x=>x.email===id);
  if(!u||u.pass!==ph)return showErr(f,'Email or password is wrong.');
  if(u.disabled)return showErr(f,'This account is disabled. Please contact the salon.');
  db.session={role:'user',id:u.id};save();ui.notice='';const to=ui.after||'salons';ui.after=null;toast('Welcome back, '+u.name.split(' ')[0]);go(to);
}
async function onRegister(f){
  const fd=new FormData(f),name=String(fd.get('name')).trim(),email=String(fd.get('email')).trim().toLowerCase(),phone=String(fd.get('phone')).trim(),pw=String(fd.get('pw'));
  if(name.length<2)return showErr(f,'Enter your full name.');
  if(!/^\S+@\S+\.\S+$/.test(email))return showErr(f,'Enter a valid email address.');
  if(!/^\d{10}$/.test(phone))return showErr(f,'Mobile number must be 10 digits.');
  if(pw.length<6)return showErr(f,'Password needs at least 6 characters.');
  if(pw!==String(fd.get('pw2')))return showErr(f,'The two passwords do not match.');
  if(db.users.some(u=>u.email===email))return showErr(f,'An account with this email already exists. Try logging in.');
  const u={id:uid('u'),name:name,email:email,phone:phone,pass:await hash(pw),sample:false,disabled:false,joined:new Date().toISOString(),prefs:{email:true,sms:true}};
  db.users.push(u);db.session={role:'user',id:u.id};save();ui.notice='';const to=ui.after||'salons';ui.after=null;toast('Account created. Welcome, '+name.split(' ')[0]+'.');go(to);
}

  '<div class="row2"><label class="f">Stylist<select name="sty">'+p.stylists.map(s=>'<option value="'+s.id+'"'+(s.id===st?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label><label class="f">Date<input type="date" name="date" required value="'+dt+'"'+(a?'':' min="'+today()+'"')+'></label></div>'+
  '<label class="f">Time (only free times are listed)<select name="time" id="ar-time"></select></label>'+
  '<div class="row2"><label class="f">Payment<select name="pay"><option value="salon"'+(payState==='salon'?' selected':'')+'>Nothing paid, pay at salon</option><option value="deposit"'+(payState==='deposit'?' selected':'')+'>Deposit received</option><option value="full"'+(payState==='full'?' selected':'')+'>Paid in full</option></select></label>'+(a?'<label class="f">Status<select name="status">'+['Confirmed','Pending payment','Completed','No-show','Cancelled'].map(s=>'<option'+(a.status===s?' selected':'')+'>'+s+'</option>').join('')+'</select></label>':'')+'</div>'+
  '<label class="f">Notes<textarea name="notes" maxlength="160">'+esc(a?a.notes:'')+'</textarea></label><p class="err" role="alert"></p><button class="btn" type="submit">'+(a?'Save changes':'Add reservation')+'</button></form>');
  fillTimes(a?a.start:null);
}
function fillTimes(keep){
  const f=$('#ar-form');if(!f)return;const p=ap(),fd=new FormData(f);
  const sv=$$('input[name=svc]:checked',f).map(i=>svcOf(p,i.value)).filter(Boolean),dur=sv.reduce((s,x)=>s+x.mins,0);
  const cur=keep!=null?keep:+$('#ar-time').value,sty=styOf(p,$('select[name=sty]',f).value),date=$('input[name=date]',f).value,id=fd.get('id');
  const sel=$('#ar-time');
  if(!dur||!sty||!date){sel.innerHTML='<option value="">Choose services and a date</option>';return}
  let slots=freeSlots(p,sty,date,dur,id||null);
  if(id&&keep!=null&&slots.indexOf(keep)<0){const a=db.appts.find(x=>x.id===id);if(a&&a.date===date&&a.stylistId===sty.id&&a.dur===dur)slots=slots.concat([keep]).sort((x,y)=>x-y)}
  sel.innerHTML=slots.length?slots.map(t=>'<option value="'+t+'"'+(t===cur?' selected':'')+'>'+fmtT(t)+'</option>').join(''):'<option value="">No free time for this stylist on this date</option>';
}

/* ---------- views + routing ---------- */
const VIEWS={salons:viewSalons,salon:viewSalon,book:viewBook,'my-bookings':viewMyBookings,login:viewAuth,admin:viewAdmin};
function render(){
  $('#app').innerHTML=header()+'<main id="main">'+VIEWS[ui.view]()+'</main>'+footer();
  if(ui.view==='salons')renderSalons();
  tickCountdown();
}
function route(){
  let v=(location.hash||'#salons').slice(1);if(!VIEWS[v])v='salons';
  if(v==='admin'&&!isAdmin()){v='login';ui.authRole='admin';ui.notice='Log in as salon manager or staff to open the salon panel.'}
  else if(v==='my-bookings'&&!currentUser()){v='login';ui.authRole='customer';ui.authMode='login';ui.notice='Log in to see your bookings.';ui.after=ui.after||'my-bookings'}
  else if(v==='login'&&db.session){v=isAdmin()?'admin':'salons'}
  else if(v!=='login')ui.notice='';
  if((v==='salon')&&!ui.pid)v='salons';
  if(v==='book'&&!ui.b)v=ui.pid?'salon':'salons';
  sweep();ui.view=v;ui.confirm=null;render();window.scrollTo(0,0);
}
function tickCountdown(){
  $$('[data-cd]').forEach(e=>{const ms=new Date(e.dataset.cd)-Date.now();e.textContent=ms>0?Math.floor(ms/60000)+':'+pad(Math.floor(ms/1000)%60):'0:00'});
}

    const a=db.appts.find(x=>x.id===t.dataset.id),p=parlour(a.parlourId);
    openModal('<div class="dhead"><h2>Send SMS</h2><button class="x" data-act="close" aria-label="Close">×</button></div><p class="muted">To '+esc(a.customer.name)+', <b>'+esc(a.customer.phone)+'</b>. You can also call from the card.</p><form class="stack" data-form="sms"><input type="hidden" name="id" value="'+a.id+'"><label class="f">Message<textarea name="text" required maxlength="160">Hi '+esc(a.customer.name.split(' ')[0])+', this is '+esc(p.name)+'. Your appointment is on '+fmtD(a.date)+' at '+fmtT(a.start)+'. Reply if you need to change it.</textarea></label><p class="err" role="alert"></p><button class="btn" type="submit">Send SMS</button></form><p class="muted sm-text">Demo: the SMS is added to the messages log. A real SMS needs a gateway such as Twilio.</p>','narrow');
  },
  'svc-new':()=>openSvc(null),'svc-edit':t=>openSvc(t.dataset.id),
  'svc-ask':t=>{ui.confirm='sv-'+t.dataset.id;render()},
  'svc-del':t=>{const p=ap();p.services=p.services.filter(s=>s.id!==t.dataset.id);ui.confirm=null;save();render();toast('Service deleted')},
  'sty-new':()=>openSty(null),'sty-edit':t=>openSty(t.dataset.id),
  'sty-ask':t=>{ui.confirm='st-'+t.dataset.id;render()},
  'sty-del':t=>{const p=ap();if(p.stylists.length<2){toast('A salon needs at least one stylist.','warn');ui.confirm=null;render();return}
    const fut=db.appts.some(a=>a.stylistId===t.dataset.id&&a.status==='Confirmed'&&startMs(a)>Date.now());
    if(fut){toast('This stylist has upcoming bookings. Move or cancel them first.','warn');ui.confirm=null;render();return}
    p.stylists=p.stylists.filter(s=>s.id!==t.dataset.id);ui.confirm=null;save();render();toast('Stylist removed')},
  'cust-toggle':t=>{const u=db.users.find(x=>x.id===t.dataset.id);u.disabled=!u.disabled;save();render();toast(u.name+(u.disabled?' is disabled':' is enabled'))},
  'reset-ask':()=>{ui.confirm='reset';render()},
  'reset-demo':async()=>{ui.confirm=null;await seed();ui.b=null;save();toast('Sample data restored. Please log in again.');route()}
};
function refreshSteps(){const o=$('.steps');if(!o||!ui.b)return;$$('li',o).forEach((li,i)=>{li.className=(i+1<ui.b.step?'done':'')+(i+1===ui.b.step?' now':'')})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const fn=ACT[t.dataset.act];if(fn)fn(t,e)});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='sf-q'){ui.sf.q=t.value;renderSalons()}
  else if(id==='pf-cardno'){t.value=t.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim()}
  else if(id==='pf-cardexp'){const x=t.value.replace(/\D/g,'').slice(0,4);t.value=x.length>2?x.slice(0,2)+'/'+x.slice(2):x}
  else if(id==='pf-cardcvv'){t.value=t.value.replace(/\D/g,'').slice(0,3)}
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  if(t.name==='bsvc'&&ui.b){const l=$$('input[name=bsvc]:checked').map(i=>i.value);ui.b.svc=l;const s=$('#bk-sum');if(s)s.innerHTML=bookSummary()}
  else if(t.name==='bsty'&&ui.b){ui.b.sty=t.value;ui.b.date=null;ui.b.t=null;const s=$('#bk-sum');if(s)s.innerHTML=bookSummary()}
  else if(t.name==='bpay'&&ui.b){ui.b.choice=t.value}
  else if(t.name==='pfm'){['card','paypal','upi'].forEach(k=>{const e2=$('#pf-'+k);if(e2)e2.hidden=k!==t.value});if(ui.b)ui.b.method=t.value}
  else if(id==='adm-p'){ui.ap=t.value;ui.ac=null;render()}
  else if(id==='adm-upf'){ui.upF=t.value;render()}
  else if(id==='adm-fbf'){ui.fbF=t.value;render()}
  else if(t.closest&&t.closest('#ar-form')&&(t.name==='svc'||t.name==='sty'||t.name==='date'))fillTimes(null);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form,fd=new FormData(f),p=db.parlours?ap():null;
  if(k==='login')return onLogin(f);
  if(k==='register')return onRegister(f);
  if(k==='profile'){
    const u=currentUser(),name=String(fd.get('name')).trim(),phone=String(fd.get('phone')).trim();
    if(name.length<2)return showErr(f,'Enter your full name.');
    if(!/^\d{10}$/.test(phone))return showErr(f,'Mobile number must be 10 digits.');
    u.name=name;u.phone=phone;u.prefs={email:fd.get('pe')==='on',sms:fd.get('ps')==='on'};save();toast('Details saved');return;
  }
  if(k==='feedback'){
    const a=db.appts.find(x=>x.id===ui.fb.id),u=currentUser(),text=String(fd.get('text')).trim();
    if(!text)return showErr(f,'Please write a few words.');
    const fb={id:uid('f'),parlourId:a.parlourId,userId:u.id,name:u.name,rating:ui.fb.rating,text:text,date:today(),svc:a.svc.map(s=>s.name).join(', ')};
    db.fb.push(fb);a.fbId=fb.id;save();closeModal();render();toast('Thank you for your feedback');return;
  }
  if(k==='block'){
    const date=String(fd.get('date')),all=fd.get('all')==='on';let from=+fd.get('from'),to=+fd.get('to');
    if(all){from=0;to=1440}
    if(!date||date<today())return showErr(f,'Pick today or a later date.');
    if(to<=from)return showErr(f,'The end time must be after the start time.');
    p.blocks.push({id:uid('b'),date:date,from:from,to:to,stylistId:String(fd.get('sty')),note:String(fd.get('note')).trim()});
    const clash=db.appts.filter(a=>a.parlourId===p.id&&a.date===date&&holds(a)&&a.start<to&&a.start+a.dur>from&&(!fd.get('sty')||a.stylistId===fd.get('sty'))).length;
    save();ui.ac.date=date;render();toast('Hours blocked'+(clash?'. '+clash+' existing booking'+(clash>1?'s':'')+' overlap, contact those customers.':''),clash?'warn':'');return;
  }
  if(k==='sms'){
    const a=db.appts.find(x=>x.id===String(fd.get('id'))),text=String(fd.get('text')).trim();if(!text)return showErr(f,'Write a message.');
    addMsg({userId:a.userId,parlourId:a.parlourId,apptId:a.id,kind:'SMS',to:a.customer.phone,subject:'SMS from the salon',body:text});save();closeModal();toast('SMS logged (demo: nothing was sent)');return;
  }
  if(k==='svc'){
    const id=String(fd.get('id')),v={name:String(fd.get('name')).trim(),cat:String(fd.get('cat')),mins:+fd.get('mins'),price:Math.round(+fd.get('price')),desc:String(fd.get('desc')).trim(),on:fd.get('on')==='on'};
    if(!v.name||!v.desc||!(v.mins>=15)||!(v.price>=0))return showErr(f,'Please fill in every field.');
    if(id)Object.assign(svcOf(p,id),v);else p.services.push(Object.assign({id:p.id+'-'+uid('x')},v));
    save();closeModal();render();toast(id?'Service updated':'Service added');return;
  }
  if(k==='sty'){
    const id=String(fd.get('id')),skills=fd.getAll('skill'),days=fd.getAll('day').map(Number),from=+fd.get('from'),to=+fd.get('to');
    if(!skills.length)return showErr(f,'Choose at least one thing this stylist can do.');
    if(!days.length)return showErr(f,'Choose at least one working day.');
    if(to<=from)return showErr(f,'The end time must be after the start time.');
    const v={name:String(fd.get('name')).trim(),role:String(fd.get('role')).trim(),bio:String(fd.get('bio')).trim(),skills:skills,days:days,from:from,to:to,hue:+fd.get('hue')};
    if(id)Object.assign(styOf(p,id),v);else p.stylists.push(Object.assign({id:p.id+'-'+uid('s')},v));
    save();closeModal();render();toast(id?'Stylist updated':'Stylist added');return;
  }
  if(k==='settings'){
    const open=+fd.get('open'),close=+fd.get('close'),pct=+fd.get('pct'),hold=+fd.get('hold'),fh=+fd.get('freeHrs');
    if(close<=open)return showErr(f,'Closing time must be after opening time.');
    if(!(pct>=10&&pct<=90)||!(hold>=5)||!(fh>=1))return showErr(f,'Check the deposit, hold and cancellation numbers.');
    Object.assign(p,{name:String(fd.get('name')).trim(),phone:String(fd.get('phone')).trim(),area:String(fd.get('area')).trim(),city:String(fd.get('city')).trim(),open:open,close:close,closed:fd.getAll('closed').map(Number)});
    p.pay={require:String(fd.get('require')),pct:pct,hold:hold,freeHrs:fh,methods:{card:fd.get('m_card')==='on',paypal:fd.get('m_paypal')==='on',upi:fd.get('m_upi')==='on'}};
    save();render();toast('Settings saved');return;
  }
  if(k==='appt'){
    const id=String(fd.get('id')),a=id?db.appts.find(x=>x.id===id):null;
    const svc=fd.getAll('svc'),sty=String(fd.get('sty')),date=String(fd.get('date')),time=fd.get('time'),payS=String(fd.get('pay'));
    if(!svc.length)return showErr(f,'Choose at least one service.');
    if(time===''||time==null)return showErr(f,'Pick a free time.');
    const sv=svc.map(s=>svcOf(p,s)),dur=sv.reduce((s,x)=>s+x.mins,0),total=sv.reduce((s,x)=>s+x.price,0),start=+time;
    if(!freeSlots(p,styOf(p,sty),date,dur,id||null).some(t=>t===start)&&!(a&&a.date===date&&a.stylistId===sty&&a.start===start&&a.dur===dur))return showErr(f,'That time is no longer free. Pick another.');
    const paid=payS==='full'?total:payS==='deposit'?depositOf(p,total):0;
    if(a){
      const m=mkAppt(p,{svc:svc,sty:sty,date:date,start:start,status:a.status,customer:a.customer});
      Object.assign(a,{svc:m.svc,stylistId:m.stylistId,stylistName:m.stylistName,date:date,start:start,dur:m.dur,total:m.total,paid:paid,notes:String(fd.get('notes')).trim()});
      const ns=String(fd.get('status'));if(ns!==a.status){a.status=ns;if(ns==='Cancelled')dropFutureMsgs(a.id)}
      a.history.push({at:new Date().toISOString(),text:'Edited by the salon'});
      dropFutureMsgs(a.id);if(a.status==='Confirmed')scheduleReminders(a,p);
      toast('Reservation updated');
    }else{
      const cname=String(fd.get('cname')).trim(),cphone=String(fd.get('cphone')).trim();
      if(cname.length<2)return showErr(f,'Enter the customer name.');
      if(!/^\d{10}$/.test(cphone))return showErr(f,'Phone must be 10 digits.');
      const n=mkAppt(p,{customer:{name:cname,phone:cphone,email:''},svc:svc,sty:sty,date:date,start:start,status:'Confirmed',paid:paid,method:paid?'At salon':'',source:'salon',notes:String(fd.get('notes')).trim()});
      db.appts.push(n);scheduleReminders(n,p);toast('Reservation added');
    }
    save();closeModal();render();return;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').firstChild)closeModal()});
window.addEventListener('hashchange',route);

(async function(){
  db=loadDB();if(!db){db=await seed();save()}
  if(db.session&&db.session.role==='user'&&!currentUser())db.session=null;
  ui.ap=db.parlours[0].id;
  route();
  let n=0;
  setInterval(()=>{
    tickCountdown();n++;
    if(n%10===0&&sweep()&&!$('#modal-root').firstChild&&(ui.view==='my-bookings'||ui.view==='admin')){render()}
  },1000);
})();
})();
