<title>Buy a Cake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar; shop is a filter bar over a card grid; checkout is items + form beside a summary; admin is tabbed cards. All stack to one column on phones.
   Palette: raspberry accent on blush paper, plum ink, pistachio for "good" states. Type: Bricolage Grotesque for headings, DM Sans for text. */
:root{
  --bg:#FCF6F8;--surface:#FFFFFF;--tint:#F7E9EE;--ink:#2B1822;--muted:#6F5A65;--line:#EBD8DF;
  --accent:#B3245C;--accent-ink:#FFFFFF;--accent-soft:#F8DCE7;
  --leaf:#2F6B3C;--leaf-soft:#E2F0E4;--amber:#7A4E08;--amber-soft:#FBEBCB;--bad:#B42318;--bad-soft:#FBE0DD;
  --shadow:0 1px 2px rgba(60,20,40,.06),0 10px 28px rgba(60,20,40,.08);
  --font-display:'Bricolage Grotesque',Georgia,serif;--font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171016;--surface:#211820;--tint:#2B1F29;--ink:#F7EAF0;--muted:#C2AAB6;--line:#3D2D38;
  --accent:#F27AA8;--accent-ink:#2B0A18;--accent-soft:#4A2236;
  --leaf:#8CD09A;--leaf-soft:#223A28;--amber:#F2C46B;--amber-soft:#41320F;--bad:#FF9A8F;--bad-soft:#4A1E1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171016;--surface:#211820;--tint:#2B1F29;--ink:#F7EAF0;--muted:#C2AAB6;--line:#3D2D38;
  --accent:#F27AA8;--accent-ink:#2B0A18;--accent-soft:#4A2236;
  --leaf:#8CD09A;--leaf-soft:#223A28;--amber:#F2C46B;--amber-soft:#41320F;--bad:#FF9A8F;--bad-soft:#4A1E1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-body);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5.2vw,46px);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.sm-text{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 20px;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font:700 21px var(--font-display);letter-spacing:-.01em}
.brand svg{color:var(--accent)}
.nav{display:flex;flex-wrap:wrap;gap:2px}
.nl{background:none;border:0;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nl:hover{background:var(--tint)}
.nl.on{color:var(--accent);font-weight:700}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-weight:700;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 5px}

main{padding-top:28px;display:flex;flex-direction:column;gap:24px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* buttons + fields */
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-height:42px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
label.f>input,label.f>select,label.f>textarea{font-weight:400;color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.err{color:var(--bad);font-size:14px;font-weight:500;min-height:0}
.err:empty{display:none}
.notice{background:var(--amber-soft);color:var(--amber);padding:10px 14px;border-radius:8px;font-weight:500}

/* shop */
.intro{display:flex;flex-direction:column;gap:10px;max-width:640px}
.intro p{color:var(--muted);font-size:16px}
.fbar{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.fbar .top-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,200px);gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.filters2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:end}
.count{color:var(--muted);font-size:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.cake{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.cake.off{opacity:.7}
.cake-img{border:0;padding:0;background:var(--tint);aspect-ratio:5/4;cursor:pointer;display:block;width:100%;position:relative}
.cake-img img{width:100%;height:100%;object-fit:cover;display:block}
.soldout{position:absolute;left:10px;top:10px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.cake-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.alt{background:var(--tint);color:var(--muted)}
.tag.leaf{background:var(--leaf-soft);color:var(--leaf)}
.by{color:var(--muted);font-size:13px}
.cake-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
.price{font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.price span,.price small{font:400 12px var(--font-body);color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* modal */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(30,10,20,.55);display:grid;place-items:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:760px;padding:20px;display:flex;flex-direction:column;gap:16px;outline:0;position:relative;min-width:0}
.dialog.narrow{max-width:520px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{background:var(--tint);border:0;border-radius:8px;width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer;flex:none}
.cake-detail{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px}
.cake-detail>img{width:100%;border-radius:12px;aspect-ratio:5/4;object-fit:cover;background:var(--tint)}
.cake-info{display:flex;flex-direction:column;gap:14px;min-width:0}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.size{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:2px}
.size b{font-size:15px}
.size span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.size.on{border-color:var(--accent);background:var(--accent-soft)}
.size.on span{color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{background:var(--tint);border:0;width:34px;height:34px;font-size:18px;cursor:pointer}
.stepper span{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
pre.mail{white-space:pre-wrap;word-break:break-word;background:var(--tint);border-radius:10px;padding:14px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:0;max-height:48vh;overflow:auto}

/* cart + checkout */
.co{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.line{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0;padding-bottom:0}
.line img{width:72px;height:58px;border-radius:8px;object-fit:cover;background:var(--tint)}
.line .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.line .meta small{color:var(--muted)}
.line .amt{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-weight:700;font-variant-numeric:tabular-nums}
.addr{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.addr input{margin-top:4px}
.addr .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.addr:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pay-opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-weight:500;cursor:pointer}
.pay-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.sum dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px;font-variant-numeric:tabular-nums}
.sum dd{margin:0;text-align:right}
.sum .tot{border-top:1px solid var(--line);padding-top:10px;font:700 20px var(--font-display)}

/* auth */
.auth{max-width:440px;margin:0 auto;width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--tint);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:7px;padding:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.hint{background:var(--tint);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.hint code{font-weight:700;color:var(--ink)}

/* orders */
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ohead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ohead strong{font:700 18px var(--font-display);margin-right:8px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 11px;white-space:nowrap}
.st-0{background:var(--amber-soft);color:var(--amber)}
.st-1,.st-2{background:var(--accent-soft);color:var(--accent)}
.st-3{background:var(--accent);color:var(--accent-ink)}
.st-4{background:var(--leaf-soft);color:var(--leaf)}
.st-5{background:var(--bad-soft);color:var(--bad)}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lines li{display:flex;gap:10px;align-items:center;justify-content:space-between}
.lines .l{display:flex;gap:10px;align-items:center;min-width:0}
.lines img{width:46px;height:38px;object-fit:cover;border-radius:6px;background:var(--tint);flex:none}
.lines .n{min-width:0}
.lines .n small{display:block;color:var(--muted)}
.oinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 20px;font-size:14px}
.oinfo b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr)}
.steps li{position:relative;text-align:center;font-size:12px;color:var(--muted);padding-top:22px;line-height:1.25;padding-inline:2px}
.steps li::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--line);z-index:1;border:2px solid var(--surface)}
.steps li:not(:first-child)::after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps li.done{color:var(--ink)}
.steps li.done::before,.steps li.done::after{background:var(--accent)}
.steps li.now{font-weight:700;color:var(--accent)}
.where{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:14px}
.hist{margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer}
.tab.on{color:var(--accent);border-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:10px 0}
.stats div{padding:0 22px 0 0;margin-right:22px;border-right:1px solid var(--line)}
.stats div:last-child{border:0;margin:0}
.stats b{display:block;font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.oedit{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) auto;gap:12px;align-items:end;border-top:1px solid var(--line);padding-top:14px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.row img{width:64px;height:52px;object-fit:cover;border-radius:8px;background:var(--tint);flex:none}
.row .grow{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.preview{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.preview img{width:120px;height:96px;object-fit:cover;border-radius:10px;background:var(--tint)}

/* toast */
#toast-root{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);max-width:460px}
.toast.warn{background:var(--amber-soft);color:var(--amber)}

@media (max-width:860px){
  .co{grid-template-columns:minmax(0,1fr)}
  .sum{position:static}
  .cake-detail{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .line{grid-template-columns:60px minmax(0,1fr)}
  .line img{width:60px;height:50px}
  .line .amt{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .oedit{grid-template-columns:minmax(0,1fr)}
  .fbar .top-row{grid-template-columns:minmax(0,1fr)}
  .steps li{font-size:11px}
  .stats div{padding-right:14px;margin-right:14px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

(function(){

function fmtDT(iso){return new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function fmtD(d){return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}

  var h=5381,t='bac:'+s;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16);

/* ---------- cake artwork (inline SVG, no external images) ---------- */
function artURI(a){
  a=a||{};
  var frost=a.frost||'#F8E3EA',base=a.base||'#B87A5A',drip=a.drip,t=a.tiers||1,top=a.top||'flower',bg=a.bg||'#F8E8EC',tc=a.tc||'#E0365B';
  var W=[196,142,96].slice(0,t),y=202,o="<rect width='300' height='240' fill='"+bg+"'/>";

  var i,w,h,x,j;
  for(i=0;i<t;i++){

async function placeOrder(btn){
  var err=$('#co-err'),u=currentUser(),rows=cartRows();
  var fail=function(m){err.textContent=m;err.scrollIntoView({block:'center'})};
  err.textContent='';if(!u||!rows.length)return;snapCheckout();
  var co=ui.co,addr=u.addresses.find(function(a){return a.id===co.addr});
  if(!addr)return fail('Choose a delivery address, or add one.');
  if(rows.some(function(r){return !r.c.available}))return fail('Remove the sold-out cakes from your cart to continue.');
  if(!co.date||co.date<localDate(1))return fail('Pick a delivery date from tomorrow onwards.');
  var pay;
  if(co.pay==='upi'){
    if(!/^[\w.\-]{2,}@[a-z]{2,}$/i.test(co.upi.trim()))return fail('Enter a valid UPI ID, for example name@bank.');
    pay={method:'UPI',status:'Paid',ref:'UPI'+Math.floor(1e8+Math.random()*9e8)};
  }else if(co.pay==='card'){
    var digits=co.cardno.replace(/\s/g,'');
    if(!/^\d{16}$/.test(digits)||!luhn(digits))return fail('That card number is not valid. Check the 16 digits.');
    if(!co.cardname.trim())return fail('Enter the name on the card.');
    var mm=co.cardexp.match(/^(\d{2})\/(\d{2})$/);
    if(!mm||+mm[1]<1||+mm[1]>12)return fail('Enter the expiry as MM/YY.');
    var now=new Date(),ey=2000+ +mm[2],em=+mm[1];
    if(ey<now.getFullYear()||(ey===now.getFullYear()&&em<now.getMonth()+1))return fail('This card has expired.');
    if(!/^\d{3}$/.test(co.cardcvv))return fail('Enter the 3-digit CVV.');
    pay={method:'Card',status:'Paid',ref:'Card •••• '+digits.slice(-4)};
  }else pay={method:'Cash on delivery',status:'Pay on delivery',ref:'COD'};
  btn.disabled=true;btn.textContent=co.pay==='cod'?'Placing order…':'Processing payment…';
  await new Promise(function(r){setTimeout(r,1300)});
  var order=buildOrder(u,addr,cart().map(function(i){return Object.assign({},i)}),{date:co.date,time:co.slot},pay,'Placed',0,false);
  db.orders.push(order);db.carts[ckey()]=[];ui.co=null;save();
  refreshHeader();
  openModal('<div class="dhead"><h2>Order '+order.id+' placed</h2><button class="x" data-act="close" aria-label="Close">×</button></div><p>Thank you, '+esc(u.name.split(' ')[0])+'. '+(pay.status==='Paid'?'Payment received ('+esc(pay.ref)+'). ':'You will pay on delivery. ')+'Your cake is booked for '+fmtD(order.slot.date)+', '+esc(order.slot.time)+'.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="track">Track my order</button><button class="btn ghost" data-act="show-mail" data-id="'+order.id+'">View confirmation email</button></div>','narrow');
  go('my-orders');
}
function luhn(s){var sum=0,alt=false;for(var i=s.length-1;i>=0;i--){var n=+s[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}return sum%10===0}

function mailText(o){
  var lines=o.items.map(function(i){return '  • '+i.name+' ('+i.sizeLabel+(i.eggless?', eggless':'')+') × '+i.qty+'   '+money(i.unit*i.qty)+(i.message?'\n    Message: “'+i.message+'”':'')}).join('\n');
  var a=o.address;

  var u={id:uid('u'),name:name,email:email,phone:phone,pass:await hash(pw),sample:false,disabled:false,joined:new Date().toISOString(),addresses:[]};

    '<div class="oinfo"><div><b>Shipping location</b>'+esc(o.address.name)+', '+addrText(o.address)+'</div><div><b>Delivery slot</b>'+fmtD(o.slot.date)+', '+esc(o.slot.time)+'</div><div><b>Payment</b>'+esc(o.pay.method)+' · '+esc(o.pay.status)+' · '+money(o.total)+'</div></div>'+
    '<div class="oedit"><label class="f">Order status<select id="st-'+o.id+'">'+ALL_STATUS.map(function(s){return '<option'+(o.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></label><label class="f">Where is it now? (shown to the customer)<input id="lc-'+o.id+'" maxlength="80" value="'+esc(o.location)+'"></label><button class="btn" data-act="ord-update" data-id="'+o.id+'">Update</button></div></article>';
  }).join('');
}
function adminCakes(){
  return '<div class="toolbar"><h2>Manage cakes</h2><button class="btn" data-act="cake-new">Post a new cake</button></div>'+
  db.cakes.map(function(c){
    return '<div class="row"><img src="'+cakeImg(c)+'" alt=""><div class="grow"><strong>'+esc(c.name)+'</strong><span class="muted sm-text">'+esc(c.cat)+' · '+esc(c.sub)+' · '+esc(c.seller)+', '+esc(c.place)+'</span><span class="sm-text">'+money(c.price)+' per ½ kg'+(c.eggless?' · eggless option':'')+'</span></div>'+
    '<div class="acts"><button class="btn ghost sm" data-act="cake-toggle" data-id="'+c.id+'" aria-pressed="'+c.available+'">'+(c.available?'On sale':'Sold out')+'</button><button class="btn ghost sm" data-act="cake-edit" data-id="'+c.id+'">Edit</button>'+
    (ui.confirm==='ck-'+c.id?'<button class="btn danger sm" data-act="cake-del" data-id="'+c.id+'">Confirm delete</button>':'<button class="btn danger sm" data-act="cake-ask" data-id="'+c.id+'">Delete</button>')+'</div></div>';

function adminCustomers(){
  if(!db.users.length)return '<div class="empty"><p class="muted">No customers have registered yet.</p></div>';
  return '<h2>Customer accounts</h2>'+db.users.map(function(u){
    var n=db.orders.filter(function(o){return o.userId===u.id}).length;
    return '<div class="row"><div class="grow"><strong>'+esc(u.name)+(u.sample?' <span class="tag alt">Sample</span>':'')+(u.disabled?' <span class="tag" style="background:var(--bad-soft);color:var(--bad)">Disabled</span>':'')+'</strong><span class="muted sm-text">'+esc(u.email)+' · '+esc(u.phone)+'</span><span class="sm-text">'+n+(n===1?' order':' orders')+' · joined '+fmtDT(u.joined)+'</span></div><div class="acts"><button class="btn ghost sm" data-act="cust-toggle" data-id="'+u.id+'">'+(u.disabled?'Enable account':'Disable account')+'</button></div></div>';
  }).join('');
}
function openCakeForm(id){
  var c=id?cakeById(id):null;
  ui.img=c?c.image:null;
  var cats=Array.from(new Set(CATS.concat(db.cakes.map(function(x){return x.cat})))),subs=Array.from(new Set(db.cakes.map(function(x){return x.sub})));
  c=c||{name:'',cat:'Birthday',sub:'',price:'',seller:'',place:'',desc:'',eggless:false,available:true};
  openModal('<div class="dhead"><h2>'+(id?'Edit cake':'Post a new cake')+'</h2><button class="x" data-act="close" aria-label="Close">×</button></div>'+
  '<form class="stack" data-form="cake"><input type="hidden" name="id" value="'+esc(id||'')+'"><label class="f">Cake name<input name="name" required maxlength="50" value="'+esc(c.name)+'"></label>'+
  '<div class="row2"><label class="f">Category (occasion)<input name="cat" list="dl-cat" required value="'+esc(c.cat)+'"></label><label class="f">Sub category (flavour)<input name="sub" list="dl-sub" required placeholder="Chocolate" value="'+esc(c.sub)+'"></label></div>'+
  '<datalist id="dl-cat">'+cats.map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist><datalist id="dl-sub">'+subs.map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist>'+
  '<div class="row2"><label class="f">Baker or counter<input name="seller" required value="'+esc(c.seller)+'"></label><label class="f">Town or village<input name="place" required value="'+esc(c.place)+'"></label></div>'+
  '<label class="f">Price for ½ kg (₹)<input name="price" type="number" inputmode="numeric" min="50" max="20000" required value="'+esc(c.price)+'"></label>'+
  '<label class="f">Description<textarea name="desc" required maxlength="260">'+esc(c.desc)+'</textarea></label>'+
  '<div><div class="eyebrow" style="margin-bottom:6px">Photo</div><div class="preview"><img id="img-prev" src="'+(ui.img||artURI(c.art||defaultArt(c.sub)))+'" alt="Cake photo preview"><div class="stack" style="gap:8px"><input type="file" id="cake-img-file" accept="image/*"><button type="button" class="link sm-text" data-act="img-clear">Use the drawn cake instead</button></div></div></div>'+
  '<label class="check"><input type="checkbox" name="eggless"'+(c.eggless?' checked':'')+'> Eggless option available</label><label class="check"><input type="checkbox" name="available"'+(c.available?' checked':'')+'> On sale today</label>'+
  '<p class="err" role="alert"></p><button class="btn" type="submit">'+(id?'Save changes':'Post cake')+'</button></form>');
}
function readImage(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();fr.onerror=rej;
    fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
      var r=Math.min(1,720/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.8))};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

/* ---------- views + routing ---------- */
var VIEWS={shop:viewShop,cart:viewCart,'my-orders':viewOrders,account:viewAccount,login:viewAuth,admin:viewAdmin};
function render(){
  snapCheckout();
  $('#app').innerHTML=header()+'<main id="main">'+VIEWS[ui.view]()+'</main>'+footer();
  if(ui.view==='shop')renderGrid();
}
function route(){
  var v=(location.hash||'#shop').slice(1);if(!VIEWS[v])v='shop';
  if(v==='admin'&&!isAdmin()){v='login';ui.authRole='admin';ui.notice='Log in as admin to open the admin panel.'}
  else if((v==='my-orders'||v==='account')&&!currentUser()){v='login';ui.authRole='customer';ui.authMode='login';ui.notice='Log in to see this page.';ui.after=ui.after||v}
  else if(v==='login'&&db.session){v=isAdmin()?'admin':'shop'}
  else if(v!=='login')ui.notice='';
  ui.view=v;ui.confirm=null;render();window.scrollTo(0,0);
}

/* ---------- events ---------- */
var ACT={
  open:function(t){openCake(t.dataset.id)},
  overlay:function(t,e){if(e.target===t)closeModal()},
  close:function(){closeModal()},
  'm-size':function(t){ui.m.size=+t.dataset.i;updModal()},
  'm-qty':function(t){ui.m.qty=Math.max(1,Math.min(10,ui.m.qty+ +t.dataset.d));updModal()},
  'm-add':function(){
    var m=ui.m;addToCart({cakeId:m.id,size:m.size,eggless:m.eggless,message:(m.msg||'').trim(),qty:m.qty});
    save();closeModal();refreshHeader();toast('Added to your cart')
  },
  'f-cat':function(t){ui.f.cat=t.dataset.v;render()},
  'f-reset':function(){ui.f={q:'',cat:'All',sub:'All',min:'',max:'',sort:'featured'};render()},
  'cart-qty':function(t){var it=cart()[+t.dataset.i];if(!it)return;it.qty=Math.max(1,Math.min(10,it.qty+ +t.dataset.d));save();$('#cart-items').innerHTML=cartItemsHtml();$('#summary').innerHTML=summaryHtml();refreshHeader()},
  'cart-del':function(t){cart().splice(+t.dataset.i,1);save();if(!cart().length)render();else{$('#cart-items').innerHTML=cartItemsHtml();$('#summary').innerHTML=summaryHtml()}refreshHeader()},
  'go-login':function(t){ui.authRole='customer';ui.authMode=t.dataset.mode;ui.after='cart';ui.notice='';go('login')},
  'auth-role':function(t){ui.authRole=t.dataset.v;ui.notice='';render()},
  'auth-mode':function(t){ui.authMode=t.dataset.v;ui.notice='';render()},
  logout:function(){db.session=null;ui.co=null;save();toast('You are logged out');go('shop')},
  'addr-new':function(){openAddr(null)},
  'addr-edit':function(t){openAddr(t.dataset.id)},
  'addr-ask':function(t){ui.confirm='ad-'+t.dataset.id;render()},
  'addr-del':function(t){var u=currentUser();u.addresses=u.addresses.filter(function(a){return a.id!==t.dataset.id});ui.confirm=null;save();render();toast('Address deleted')},
  'fill-card':function(){$('#co-cardno').value='4242 4242 4242 4242';$('#co-cardname').value=(currentUser()||{name:'Test Customer'}).name;$('#co-cardexp').value='12/30';$('#co-cardcvv').value='123'},
  place:function(t){placeOrder(t)},
  track:function(){closeModal()},
  'show-mail':function(t){
    var o=db.orders.find(function(x){return x.id===t.dataset.id});if(!o)return;
    openModal('<div class="dhead"><h2>Confirmation email</h2><button class="x" data-act="close" aria-label="Close">×</button></div><pre class="mail">'+esc(mailText(o))+'</pre><p class="muted sm-text">This is a preview. A page like this has no mail server, so nothing is sent. A backend (for example Node.js with Nodemailer) can send this exact text.</p>','narrow');
  },
  'admin-tab':function(t){ui.adminTab=t.dataset.v;ui.confirm=null;render()},
  'ord-update':function(t){
    var o=db.orders.find(function(x){return x.id===t.dataset.id});if(!o)return;
    var st=$('#st-'+o.id).value,loc=$('#lc-'+o.id).value.trim();
    var changed=st!==o.status;
    if(!loc||(changed&&loc===o.location))loc=defaultLoc(st,o);
    if(!changed&&loc===o.location){toast('Nothing to update');return}
    o.status=st;o.location=loc;o.history.push({status:st,at:new Date().toISOString(),loc:loc});save();render();toast('Order '+o.id+' is now '+st);
  },
  'cake-new':function(){openCakeForm(null)},
  'cake-edit':function(t){openCakeForm(t.dataset.id)},
  'cake-toggle':function(t){var c=cakeById(t.dataset.id);c.available=!c.available;save();render();toast(c.name+(c.available?' is on sale':' marked sold out'))},
  'cake-ask':function(t){ui.confirm='ck-'+t.dataset.id;render()},
  'cake-del':function(t){db.cakes=db.cakes.filter(function(c){return c.id!==t.dataset.id});ui.confirm=null;save();render();toast('Cake deleted')},
  'img-clear':function(){ui.img=null;var p=$('#img-prev');if(p)p.src=artURI(defaultArt(($('input[name=sub]')||{}).value))},
  'cust-toggle':function(t){var u=db.users.find(function(x){return x.id===t.dataset.id});u.disabled=!u.disabled;save();render();toast(u.name+(u.disabled?' is disabled':' is enabled'))},
  'reset-ask':function(){ui.confirm='reset';render()},
  'reset-demo':async function(){ui.confirm=null;await seed();ui.co=null;save();toast('Sample data restored. Please log in again.');route()}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var fn=ACT[t.dataset.act];if(fn)fn(t,e);
});
document.addEventListener('input',function(e){
  var t=e.target,id=t.id;
  if(id==='f-q'){ui.f.q=t.value;renderGrid()}
  else if(id==='f-min'){ui.f.min=t.value;renderGrid()}
  else if(id==='f-max'){ui.f.max=t.value;renderGrid()}
  else if(id==='m-msg'&&ui.m){ui.m.msg=t.value}
  else if(id==='co-cardno'){var d=t.value.replace(/\D/g,'').slice(0,16);t.value=d.replace(/(.{4})/g,'$1 ').trim()}
  else if(id==='co-cardexp'){var x=t.value.replace(/\D/g,'').slice(0,4);t.value=x.length>2?x.slice(0,2)+'/'+x.slice(2):x}
  else if(id==='co-cardcvv'){t.value=t.value.replace(/\D/g,'').slice(0,3)}
});
document.addEventListener('change',function(e){
  var t=e.target,id=t.id;
  if(id==='f-sub'){ui.f.sub=t.value;renderGrid()}
  else if(id==='f-sort'){ui.f.sort=t.value;renderGrid()}
  else if(id==='m-egg'&&ui.m){ui.m.eggless=t.checked;updModal()}
  else if(t.name==='pay'){showPay(t.value)}
  else if(id==='adm-ord-f'){ui.ordF=t.value;render()}
  else if(id==='cake-img-file'&&t.files&&t.files[0]){
    readImage(t.files[0]).then(function(url){ui.img=url;var p=$('#img-prev');if(p)p.src=url}).catch(function(){var f=t.closest('form');showErr(f,'That file could not be read as an image. Try a JPG or PNG.')});
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var kind=f.dataset.form;
  if(kind==='login')onLogin(f);
  else if(kind==='register')onRegister(f);
  else if(kind==='profile'){
    var u=currentUser(),fd=new FormData(f),name=String(fd.get('name')).trim(),phone=String(fd.get('phone')).trim();
    if(name.length<2)return showErr(f,'Enter your full name.');
    if(!/^\d{10}$/.test(phone))return showErr(f,'Mobile number must be 10 digits.');
    u.name=name;u.phone=phone;save();toast('Details saved');refreshHeader();
  }
  else if(kind==='addr'){
    var u2=currentUser(),d=new FormData(f),a={id:String(d.get('id'))||uid('a'),label:d.get('label'),name:String(d.get('name')).trim(),phone:String(d.get('phone')).trim(),line:String(d.get('line')).trim(),area:String(d.get('area')).trim(),city:String(d.get('city')).trim(),state:String(d.get('state')).trim(),pin:String(d.get('pin')).trim()};
    if(!/^\d{10}$/.test(a.phone))return showErr(f,'Phone number must be 10 digits.');
    if(!/^\d{6}$/.test(a.pin))return showErr(f,'PIN code must be 6 digits.');
    var i=u2.addresses.findIndex(function(x){return x.id===a.id});
    if(i>-1){u2.addresses[i]=a;toast('Address updated')}else{u2.addresses.push(a);toast('Address saved');if(ui.co)ui.co.addr=a.id}
    save();closeModal();render();
  }
  else if(kind==='cake'){
    var d2=new FormData(f),id=String(d2.get('id')),price=Math.round(+d2.get('price'));
    var vals={name:String(d2.get('name')).trim(),cat:String(d2.get('cat')).trim(),sub:String(d2.get('sub')).trim(),seller:String(d2.get('seller')).trim(),place:String(d2.get('place')).trim(),desc:String(d2.get('desc')).trim(),eggless:d2.get('eggless')==='on',available:d2.get('available')==='on'};
    if(!(price>=50))return showErr(f,'Enter a price of at least ₹50 for ½ kg.');
    if(!vals.name||!vals.cat||!vals.sub||!vals.seller||!vals.place||!vals.desc)return showErr(f,'Please fill in every field.');
    vals.price=price;vals.image=ui.img||null;
    if(id){var c=cakeById(id);Object.assign(c,vals);toast('Cake updated')}
    else{db.cakes.unshift(Object.assign({id:uid('c'),art:defaultArt(vals.sub)},vals));toast('Cake posted')}
    save();closeModal();render();
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#modal-root').firstChild)closeModal()});
window.addEventListener('hashchange',route);

/* ---------- start ---------- */
(async function(){
  db=loadDB();if(!db)db=await seed();
  if(db.session&&db.session.role==='user'&&!currentUser())db.session=null;
  route();
})();
})();
</script>
