<title>TechSavvy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar with search; home = category cards with subcategory links, then deal and recommendation rows; shop = filter column beside a product grid; product page = picture beside buy box; cart/checkout = items beside a summary rail. All stack to one column on phones.
   Palette: cobalt accent on cool grey paper, ink-navy text, amber for deals, green for stock. Type: Sora for headings, Manrope for text. */
:root{
  --bg:#F3F5FA;--surface:#FFFFFF;--tint:#E8ECF7;--ink:#111A33;--muted:#59648A;--line:#D8DEEE;
  --accent:#2347E8;--accent-ink:#FFFFFF;--accent-soft:#DDE4FD;
  --deal:#A5470A;--deal-soft:#FDE8D2;--ok:#0F7B4A;--ok-soft:#D9F2E5;--bad:#B42318;--bad-soft:#FBE0DD;--star:#C77D00;
  --shadow:0 1px 2px rgba(20,30,70,.06),0 10px 26px rgba(20,30,70,.08);
  --font-display:'Sora','Trebuchet MS',sans-serif;--font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1020;--surface:#141B31;--tint:#1C2543;--ink:#E8ECFB;--muted:#A3AED2;--line:#2A3558;
  --accent:#8CA3FF;--accent-ink:#0A1230;--accent-soft:#243066;
  --deal:#FFB877;--deal-soft:#43280F;--ok:#7BE0AE;--ok-soft:#10382A;--bad:#FF9A8F;--bad-soft:#4A1E1A;--star:#F2B84B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1020;--surface:#141B31;--tint:#1C2543;--ink:#E8ECFB;--muted:#A3AED2;--line:#2A3558;
  --accent:#8CA3FF;--accent-ink:#0A1230;--accent-soft:#243066;
  --deal:#FFB877;--deal-soft:#43280F;--ok:#7BE0AE;--ok-soft:#10382A;--bad:#FF9A8F;--bad-soft:#4A1E1A;--star:#F2B84B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-body);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4.6vw,42px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(20px,3vw,26px);font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.sm{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font:800 21px var(--font-display);letter-spacing:-.02em}
.brand svg{color:var(--accent)}
.hsearch{flex:1 1 260px;display:flex;gap:8px;min-width:0;order:2}
.hsearch input{min-width:0}
.nav{display:flex;flex-wrap:wrap;gap:2px;margin-left:auto;order:3}
.nl{background:none;border:0;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nl:hover{background:var(--tint)}
.nl.on{color:var(--accent);font-weight:700}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-weight:700;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 5px}
main{padding-top:26px;display:flex;flex-direction:column;gap:26px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-height:42px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
label.f>input,label.f>select,label.f>textarea{font-weight:400;color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.err{color:var(--bad);font-size:14px;font-weight:500}
.err:empty{display:none}
.notice{background:var(--deal-soft);color:var(--deal);padding:10px 14px;border-radius:8px;font-weight:500}
.hint{background:var(--tint);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.hint code{font-weight:700;color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:inline-block}
.tag.alt{background:var(--tint);color:var(--muted)}
.tag.deal{background:var(--deal-soft);color:var(--deal)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--deal-soft);color:var(--deal)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.price{font:700 18px var(--font-display);font-variant-numeric:tabular-nums}
.price s{font:400 13px var(--font-body);color:var(--muted);margin-left:4px}

/* home */
.hero{display:flex;flex-direction:column;gap:12px;max-width:700px}
.hero p{color:var(--muted);font-size:16px}
.codes{display:flex;flex-wrap:wrap;gap:8px}
.code{border:1px dashed var(--deal);color:var(--deal);background:var(--deal-soft);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.cat .top2{display:flex;gap:12px;align-items:center}
.cat img{width:64px;height:48px;border-radius:8px;object-fit:cover;flex:none}
.cat .name{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:700 18px var(--font-display);color:var(--ink)}
.cat .name:hover{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:14px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.rank{font-size:12px;font-weight:700;color:var(--deal);background:var(--deal-soft);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:middle;font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.pimg{display:block;position:relative;aspect-ratio:4/3;background:var(--tint)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.off{position:absolute;left:10px;top:10px;background:var(--deal);color:var(--surface);font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px}
.so{position:absolute;right:10px;top:10px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h3 a{color:var(--ink);text-decoration:none}
.pbody h3 a:hover{color:var(--accent)}
.by{color:var(--muted);font-size:13px}
.pfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px;flex-wrap:wrap}
.pfoot .acts{display:flex;gap:6px;align-items:center}
.icon{background:var(--bg);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon:hover{border-color:var(--accent);color:var(--accent)}
.icon.on{color:var(--bad);border-color:var(--bad)}
.icon.on svg{fill:currentColor}

/* shop */
.shop{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:12px}

/* product page */
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
.pd>img{width:100%;border-radius:14px;aspect-ratio:4/3;object-fit:cover;background:var(--tint)}
.buy{display:flex;flex-direction:column;gap:14px;min-width:0}
.big{font:800 30px var(--font-display);font-variant-numeric:tabular-nums}
.big s{font:400 16px var(--font-body);color:var(--muted);margin-left:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{background:var(--tint);border:0;width:34px;height:34px;font-size:18px;cursor:pointer}
.stepper span{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
table.spec{border-collapse:collapse;width:100%}
table.spec th{text-align:left;width:38%;color:var(--muted);font-weight:500;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.spec td{padding:8px 0;border-bottom:1px solid var(--line)}
.rev{display:flex;flex-direction:column;gap:3px;padding:12px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border-bottom:0}

/* cart, checkout */
.co{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.line{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0;padding-bottom:0}
.line img{width:76px;height:58px;border-radius:8px;object-fit:cover;background:var(--tint)}
.line .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.line .meta a{color:var(--ink);font-weight:700;text-decoration:none}
.line .amt{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-weight:700;font-variant-numeric:tabular-nums}
.sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.sum dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px;font-variant-numeric:tabular-nums}
.sum dd{margin:0;text-align:right}
.sum .tot{border-top:1px solid var(--line);padding-top:10px;font:700 20px var(--font-display)}
.sum .good{color:var(--ok)}
.addr,.pay-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.addr:has(input:checked),.pay-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.addr .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.pay-opt{align-items:center;font-weight:500;cursor:pointer}

/* auth */
.auth{max-width:440px;margin:0 auto;width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--tint);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:7px;padding:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

/* orders */
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ohead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ohead strong{font:700 17px var(--font-display);margin-right:8px}
.st-Placed,.st-Confirmed,.st-Packed{background:var(--accent-soft);color:var(--accent)}
.st-Shipped{background:var(--accent);color:var(--accent-ink)}
.st-Delivered{background:var(--ok-soft);color:var(--ok)}
.st-Cancelled{background:var(--bad-soft);color:var(--bad)}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lines li{display:flex;gap:10px;align-items:center;justify-content:space-between}
.lines .l{display:flex;gap:10px;align-items:center;min-width:0}
.lines img{width:46px;height:36px;object-fit:cover;border-radius:6px;background:var(--tint);flex:none}
.lines .n{min-width:0}
.lines .n small{display:block;color:var(--muted)}
.oinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 20px;font-size:14px}
.oinfo b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr)}
.steps li{position:relative;text-align:center;font-size:12px;color:var(--muted);padding-top:22px;line-height:1.25;padding-inline:2px}
.steps li::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--line);z-index:1;border:2px solid var(--surface)}
.steps li:not(:first-child)::after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps li.done{color:var(--ink)}
.steps li.done::before,.steps li.done::after{background:var(--accent)}
.steps li.now{font-weight:700;color:var(--accent)}
.where{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:14px}
.hist{margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
pre.mail{white-space:pre-wrap;word-break:break-word;background:var(--tint);border-radius:10px;padding:14px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:0;max-height:48vh;overflow:auto}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer}
.tab.on{color:var(--accent);border-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:10px 0}
.stats div{padding:0 22px 0 0;margin-right:22px;border-right:1px solid var(--line)}
.stats div:last-child{border:0;margin:0}
.stats b{display:block;font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.row img{width:64px;height:48px;object-fit:cover;border-radius:8px;background:var(--tint);flex:none}
.row .grow{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pr{display:flex;gap:6px;align-items:center}
.pr input{width:110px;min-height:34px;padding:5px 10px}
.oedit{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) auto;gap:12px;align-items:end;border-top:1px solid var(--line);padding-top:14px}
.preview{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.preview img{width:120px;height:90px;object-fit:cover;border-radius:10px;background:var(--tint)}
details.cu{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.cu summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
details.cu .in{margin-top:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
table.t th{text-align:left;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
table.t td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}

/* modal + toast */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(6,10,28,.6);display:grid;place-items:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:680px;padding:20px;display:flex;flex-direction:column;gap:16px;outline:0;min-width:0}
.dialog.narrow{max-width:500px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{background:var(--tint);border:0;border-radius:8px;width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer;flex:none}
#toast-root{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);max-width:480px}
.toast.warn{background:var(--deal-soft);color:var(--deal)}

@media (max-width:900px){
  .shop{grid-template-columns:minmax(0,1fr)}
  .filters{position:static}
  .pd{grid-template-columns:minmax(0,1fr)}
  .co{grid-template-columns:minmax(0,1fr)}
  .sum{position:static}
}
@media (max-width:560px){
  .line{grid-template-columns:64px minmax(0,1fr)}
  .line img{width:64px;height:50px}
  .line .amt{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .oedit{grid-template-columns:minmax(0,1fr)}
  .steps li{font-size:11px}
  .stats div{padding-right:14px;margin-right:14px}
  .nav{margin-left:0;order:2}
  .hsearch{order:3;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const LS_KEY='techsavvy.v1';
const STATUS=['Placed','Confirmed','Packed','Shipped','Delivered'];
const ALLST=STATUS.concat(['Cancelled']);
const COUPONS={
  WELCOME10:{label:'10% off, up to ₹1,500, on orders above ₹1,000',min:1000},
  TECH500:{label:'₹500 off on orders above ₹15,000',min:15000},
  FREESHIP:{label:'Free delivery on any order',min:0}
};
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));

async function hash(s){
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ts:'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;const t='ts:'+s;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16);
}

function recs(limit){
  const u=user(),sc={},sub={},bought=new Set(),hist=(db.views[viewsKey()]||[]).slice(0,15);
  hist.forEach(id=>{const p=prod(id);if(p){sc[p.cat]=(sc[p.cat]||0)+1;sub[p.sub]=(sub[p.sub]||0)+1.5}});
  if(u){
    db.orders.filter(o=>o.userId===u.id&&o.status!=='Cancelled').forEach(o=>o.items.forEach(i=>{bought.add(i.pid);const p=prod(i.pid);if(p){sc[p.cat]=(sc[p.cat]||0)+3;sub[p.sub]=(sub[p.sub]||0)+3}}));
    u.wish.forEach(id=>{const p=prod(id);if(p){sc[p.cat]=(sc[p.cat]||0)+2;sub[p.sub]=(sub[p.sub]||0)+2}});
  }
  const has=Object.keys(sc).length>0;
  const list=db.products.filter(p=>p.stock>0&&!bought.has(p.id)).map(p=>({p:p,s:(sc[p.cat]||0)*.5+(sub[p.sub]||0)+rate(p).avg*.1+(hist.indexOf(p.id)>-1?-0.8:0)}));
  list.sort((a,b)=>b.s-a.s);
  return{has:has,items:list.slice(0,limit).map(x=>x.p)};
}

function luhn(s){let sum=0,alt=false;for(let i=s.length-1;i>=0;i--){let n=+s[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}return sum%10===0}
const val=id=>(document.getElementById(id)||{value:''}).value.trim();
async function placeOrder(btn){
  const err=$('#co-err'),u=user();err.textContent='';if(!u)return;cleanCart();
  const fail=m=>{err.textContent=m;err.scrollIntoView({block:'center'})};
  const rows=cartRows();if(!rows.length)return fail('Your cart is empty.');
  const addr=u.addresses.find(a=>a.id===ui.co.addr);if(!addr)return fail('Choose a delivery address, or add one.');
  const short=rows.find(r=>r.p.stock<r.it.qty);if(short)return fail(short.p.name+' has only '+short.p.stock+' left. Update your cart.');
  let pay;
  if(ui.co.pay==='upi'){if(!/^[\w.\-]{2,}@[a-z]{2,}$/i.test(val('co-upi')))return fail('Enter a valid UPI ID, for example name@bank.');pay={method:'UPI',status:'Paid',ref:'UPI'+Math.floor(1e8+Math.random()*9e8)}}
  else if(ui.co.pay==='card'){
    const dg=val('co-cardno').replace(/\s/g,'');
    if(!/^\d{16}$/.test(dg)||!luhn(dg))return fail('That card number is not valid. Check the 16 digits.');
    if(!val('co-cardname'))return fail('Enter the name on the card.');
    const mm=val('co-cardexp').match(/^(\d{2})\/(\d{2})$/);if(!mm||+mm[1]<1||+mm[1]>12)return fail('Enter the expiry as MM/YY.');
    const n=new Date(),ey=2000+ +mm[2],em=+mm[1];if(ey<n.getFullYear()||(ey===n.getFullYear()&&em<n.getMonth()+1))return fail('This card has expired.');
    if(!/^\d{3}$/.test(val('co-cardcvv')))return fail('Enter the 3-digit CVV.');
    pay={method:'Card',status:'Paid',ref:'Card •••• '+dg.slice(-4)};
  }else pay={method:'Cash on delivery',status:'Pay on delivery',ref:'COD'};
  btn.disabled=true;btn.textContent=ui.co.pay==='cod'?'Placing order…':'Processing payment…';
  await new Promise(r=>setTimeout(r,1200));
  const again=cartRows(),gone=again.find(r=>r.p.stock<r.it.qty);
  if(gone){btn.disabled=false;btn.textContent='Place order';return fail(gone.p.name+' just sold out. Update your cart.')}
  const o=mkOrder(u,addr,again.map(r=>({pid:r.p.id,qty:r.it.qty})),ui.coupon,pay,'Placed',0,false);
  again.forEach(r=>{r.p.stock-=r.it.qty;r.p.sold+=r.it.qty});
  db.orders.push(o);db.carts[ckey()]=[];ui.coupon='';save();refreshHeader();
  openModal('<div class="dhead"><h2>Order '+o.id+' placed</h2><button class="x" data-act="close" aria-label="Close">×</button></div><p>Thank you, '+esc(u.name.split(' ')[0])+'. '+(pay.status==='Paid'?'Payment received ('+esc(pay.ref)+'). ':'You will pay on delivery. ')+'We have sent your order to the seller and a confirmation to '+esc(u.email)+'.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="close">Track my order</button><button class="btn ghost" data-act="show-mail" data-id="'+o.id+'" data-who="customer">View confirmation email</button></div>','narrow');
  go('orders');
}

}

const VIEWS={home:viewHome,shop:viewShop,product:viewProduct,cart:viewCart,checkout:viewCheckout,wishlist:viewWishlist,orders:viewOrders,login:viewAuth,admin:viewAdmin};
function render(){
  $('#app').innerHTML=header()+'<main id="main">'+VIEWS[view]()+'</main>'+footer();
  if(view==='shop')renderGrid();
}
function route(){
  let h=(location.hash||'#home').slice(1),id=null;
  if(h.indexOf('product-')===0){id=h.slice(8);h='product'}
  if(!VIEWS[h])h='home';
  if(h==='admin'&&!isAdmin()){h='login';ui.authRole='admin';ui.notice='Log in as admin to open the admin panel.'}
  else if((h==='orders'||h==='wishlist')&&!user()){if(isAdmin()){h='admin'}else{h='login';ui.authRole='customer';ui.authMode='login';ui.notice='Log in to see this page.';ui.after=ui.after||h}}
  else if(h==='checkout'&&!user()&&!isAdmin()){h='login';ui.authRole='customer';ui.authMode='login';ui.notice='Log in to check out. Your cart is kept.';ui.after='checkout'}
  else if(h==='login'&&db.session){h=isAdmin()?'admin':'home'}
  else if(h!=='login')ui.notice='';
  if(h==='product'){if(prod(id)){if(pid!==id)ui.q=1;trackView(id);save()}}
  view=h;pid=id;ui.confirm=null;render();window.scrollTo(0,0);
}

/* ---------- events ---------- */
const ACT={
  overlay:(t,e)=>{if(e.target===t)closeModal()},
  close:()=>closeModal(),
  'go-cat':t=>{ui.f=Object.assign({},ui.f,{q:'',cat:t.dataset.cat,sub:'All',brand:'All',min:'',max:'',stock:false});go('shop')},
  'go-sub':t=>{ui.f=Object.assign({},ui.f,{q:'',cat:t.dataset.cat,sub:t.dataset.sub,brand:'All',min:'',max:'',stock:false});go('shop')},
  'f-cat':t=>{ui.f.cat=t.dataset.v;ui.f.sub='All';render()},
  'f-reset':()=>{ui.f={q:'',cat:'All',sub:'All',brand:'All',min:'',max:'',stock:false,sort:'popular'};render()},
  'to-shop':(t,e)=>{e.preventDefault();go('shop')},
  'to-reviews':(t,e)=>{e.preventDefault();const r=$('#reviews');if(r)r.scrollIntoView({block:'start'})},
  add:t=>{if(isAdmin()){toast('Log in as a customer to shop.','warn');return}const p=prod(t.dataset.id);if(addToCart(t.dataset.id,1)){save();refreshHeader();toast(p.name+' added to cart')}else{save();refreshHeader()}},
  q:t=>{const p=prod(pid);ui.q=Math.max(1,Math.min(Math.max(1,p.stock),10,ui.q+ +t.dataset.d));$('#q').textContent=ui.q},
  'add-q':t=>{const p=prod(t.dataset.id);if(addToCart(p.id,ui.q)){save();refreshHeader();toast(ui.q+' × '+p.name+' added to cart')}else{save();refreshHeader()}},
  wish:t=>{
    const u=user();if(!u){if(isAdmin()){toast('Log in as a customer to save items.','warn');return}ui.authRole='customer';ui.authMode='login';ui.after=view==='product'?'product-'+pid:view;ui.notice='Log in to save items to your wish list.';go('login');return}
    const i=u.wish.indexOf(t.dataset.id);if(i>-1)u.wish.splice(i,1);else u.wish.push(t.dataset.id);save();render();toast(i>-1?'Removed from wish list':'Saved to wish list');
  },
  'cart-qty':t=>{const it=cart()[+t.dataset.i],p=it&&prod(it.pid);if(!it||!p)return;const n=it.qty+ +t.dataset.d;if(n>p.stock){toast('Only '+p.stock+' available.','warn');return}it.qty=Math.max(1,n);save();$('#cart-items').innerHTML=cartLines();$('#summary').innerHTML=summaryHtml();$('#coupon').innerHTML=couponHtml();refreshHeader()},
  'cart-del':t=>{cart().splice(+t.dataset.i,1);save();refreshHeader();render()},
  'coupon-clear':()=>{ui.coupon='';const c=$('#coupon');if(c)c.innerHTML=couponHtml();const s=$('#summary');if(s)s.innerHTML=summaryHtml()},
  checkout:()=>go('checkout'),
  'go-login':t=>{ui.authRole='customer';ui.authMode=t.dataset.mode;ui.after=t.dataset.after||'home';ui.notice='';go('login')},
  'auth-role':t=>{ui.authRole=t.dataset.v;ui.notice='';render()},
  'auth-mode':t=>{ui.authMode=t.dataset.v;ui.notice='';render()},
  logout:()=>{db.session=null;ui.co={addr:null,pay:'upi'};save();toast('You are logged out');go('home')},
  'addr-new':()=>openAddr(null),
  'fill-card':()=>{$('#co-cardno').value='4242 4242 4242 4242';$('#co-cardname').value=(user()||{name:'Test Customer'}).name;$('#co-cardexp').value='12/30';$('#co-cardcvv').value='123'},
  place:t=>placeOrder(t),
  'show-mail':t=>{const o=db.orders.find(x=>x.id===t.dataset.id);if(!o)return;openModal('<div class="dhead"><h2>'+(t.dataset.who==='seller'?'Order email to the seller':'Confirmation email')+'</h2><button class="x" data-act="close" aria-label="Close">×</button></div><pre class="mail">'+esc(mailText(o,t.dataset.who))+'</pre><p class="muted sm">This is a preview. A page like this has no mail server, so nothing is sent. A backend (for example Node.js with Nodemailer) could send this text.</p>','narrow')},
  'cancel-ask':t=>{ui.confirm='c-'+t.dataset.id;render()},
  'cancel-go':t=>{
    const o=db.orders.find(x=>x.id===t.dataset.id);if(!o||(o.status!=='Placed'&&o.status!=='Confirmed'))return;
    o.items.forEach(i=>{const p=prod(i.pid);if(p){p.stock+=i.qty;p.sold=Math.max(0,p.sold-i.qty)}});
    o.status='Cancelled';o.location=o.pay.status==='Paid'?'Order cancelled. Refund of '+money(o.total)+' to your '+o.pay.method+' within 5 to 7 days':'Order cancelled';o.history.push({status:'Cancelled',at:new Date().toISOString(),loc:o.location});
    ui.confirm=null;save();render();toast('Order '+o.id+' cancelled');
  },
  'buy-again':t=>{const o=db.orders.find(x=>x.id===t.dataset.id);let n=0;o.items.forEach(i=>{if(prod(i.pid)&&addToCart(i.pid,i.qty))n++});save();refreshHeader();if(n){toast('Items added to your cart');go('cart')}else toast('These items are not available right now.','warn')},
  'a-tab':t=>{ui.aTab=t.dataset.v;ui.confirm=null;render()},
  'ord-update':t=>{
    const o=db.orders.find(x=>x.id===t.dataset.id);if(!o)return;
    const st=$('#st-'+o.id).value;let loc=$('#lc-'+o.id).value.trim();const changed=st!==o.status;
    if(o.status==='Cancelled'&&changed){toast('A cancelled order cannot be reopened.','warn');return}
    if(!loc||(changed&&loc===o.location))loc=defLoc(st,o);
    if(!changed&&loc===o.location){toast('Nothing to update');return}
    if(changed&&st==='Cancelled')o.items.forEach(i=>{const p=prod(i.pid);if(p){p.stock+=i.qty;p.sold=Math.max(0,p.sold-i.qty)}});
    if(changed&&st==='Delivered'&&o.pay.status==='Pay on delivery')o.pay.status='Paid';
    o.status=st;o.location=loc;o.history.push({status:st,at:new Date().toISOString(),loc:loc});save();render();toast('Order '+o.id+' is now '+st);
  },
  'prod-new':()=>openProd(null),
  'prod-edit':t=>openProd(t.dataset.id),
  'prod-ask':t=>{ui.confirm='pd-'+t.dataset.id;render()},
  'prod-del':t=>{const p=prod(t.dataset.id);db.products=db.products.filter(x=>x.id!==t.dataset.id);ui.confirm=null;save();render();toast((p?p.name:'Item')+' removed from the store')},
  'price-set':t=>{
    const p=prod(t.dataset.id),v=Math.round(+document.getElementById('pr-'+p.id).value);
    if(!(v>0)){toast('Enter a price above zero.','warn');return}
    if(v>p.mrp)p.mrp=v;p.price=v;save();render();toast(p.name+' is now '+money(v));
  },
  'img-clear':()=>{ui.img=null;const f=$('form[data-form=prod]');const p=$('#img-prev');if(p)p.src=artURI('phone',200)},
  'reset-ask':()=>{ui.confirm='reset';render()},
  'reset-demo':async()=>{ui.confirm=null;await seed();ui.coupon='';save();toast('Sample data restored. Please log in again.');route()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const fn=ACT[t.dataset.act];if(fn)fn(t,e)});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='f-q'){ui.f.q=t.value;renderGrid()}
  else if(id==='f-min'){ui.f.min=t.value;renderGrid()}
  else if(id==='f-max'){ui.f.max=t.value;renderGrid()}
  else if(id==='co-cardno'){t.value=t.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim()}
  else if(id==='co-cardexp'){const x=t.value.replace(/\D/g,'').slice(0,4);t.value=x.length>2?x.slice(0,2)+'/'+x.slice(2):x}
  else if(id==='co-cardcvv'){t.value=t.value.replace(/\D/g,'').slice(0,3)}
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  if(id==='f-sub'){ui.f.sub=t.value;renderGrid()}
  else if(id==='f-brand'){ui.f.brand=t.value;renderGrid()}
  else if(id==='f-sort'){ui.f.sort=t.value;renderGrid()}
  else if(id==='f-stock'){ui.f.stock=t.checked;renderGrid()}
  else if(t.name==='addr'){ui.co.addr=t.value}
  else if(t.name==='pay'){ui.co.pay=t.value;['upi','card','cod'].forEach(k=>{const el=$('#pay-'+k);if(el)el.hidden=k!==t.value})}
  else if(id==='adm-cat'){ui.aCat=t.value;render()}
  else if(id==='adm-ord-f'){ui.ordF=t.value;render()}
  else if(id==='adm-cu'){ui.cuF=t.value;render()}
  else if(id==='prod-img-file'&&t.files&&t.files[0]){readImage(t.files[0]).then(url=>{ui.img=url;const p=$('#img-prev');if(p)p.src=url}).catch(()=>showErr(t.closest('form'),'That file could not be read as an image. Try a JPG or PNG.'))}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form,fd=new FormData(f);
  if(k==='login')return onLogin(f);
  if(k==='register')return onRegister(f);
  if(k==='search'){ui.f=Object.assign({},ui.f,{q:String(fd.get('q')).trim(),cat:'All',sub:'All',brand:'All',min:'',max:'',stock:false});go('shop');return}
  if(k==='coupon'){const code=String(fd.get('code')).trim().toUpperCase();ui.coupon=code;$('#coupon').innerHTML=couponHtml();$('#summary').innerHTML=summaryHtml();return}
  if(k==='review'){
    const u=user(),text=String(fd.get('text')).trim();if(!text)return showErr(f,'Please write a few words.');
    const verified=db.orders.some(o=>o.userId===u.id&&o.status!=='Cancelled'&&o.items.some(i=>i.pid===pid));
    db.reviews.push({id:uid('r'),pid:pid,name:u.name,rating:+fd.get('rating'),text:text,date:new Date().toISOString(),verified:verified,seed:false,userId:u.id});save();render();toast('Thanks for your review');return;
  }
  if(k==='addr'){
    const u=user(),a={id:String(fd.get('id'))||uid('a'),label:fd.get('label'),name:String(fd.get('name')).trim(),phone:String(fd.get('phone')).trim(),line:String(fd.get('line')).trim(),area:String(fd.get('area')).trim(),city:String(fd.get('city')).trim(),state:String(fd.get('state')).trim(),pin:String(fd.get('pin')).trim()};
    if(!/^\d{10}$/.test(a.phone))return showErr(f,'Phone number must be 10 digits.');
    if(!/^\d{6}$/.test(a.pin))return showErr(f,'PIN code must be 6 digits.');
    const i=u.addresses.findIndex(x=>x.id===a.id);if(i>-1)u.addresses[i]=a;else u.addresses.push(a);ui.co.addr=a.id;save();closeModal();render();toast('Address saved');return;
  }
  if(k==='prod'){
    const id=String(fd.get('id')),price=Math.round(+fd.get('price')),mrp=Math.round(+fd.get('mrp')),stock=Math.round(+fd.get('stock'));
    const v={name:String(fd.get('name')).trim(),brand:String(fd.get('brand')).trim(),cat:String(fd.get('cat')).trim(),sub:String(fd.get('sub')).trim(),desc:String(fd.get('desc')).trim()};
    if(!v.name||!v.brand||!v.cat||!v.sub||!v.desc)return showErr(f,'Please fill in every field.');
    if(!(price>0)||!(mrp>0))return showErr(f,'Enter a price above zero.');
    if(mrp<price)return showErr(f,'The list price (MRP) cannot be lower than the selling price.');
    if(!(stock>=0))return showErr(f,'Stock cannot be negative.');
    v.price=price;v.mrp=mrp;v.stock=stock;v.image=ui.img||null;
    v.specs=String(fd.get('specs')).split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.indexOf(':');return i>0?{k:s.slice(0,i).trim(),v:s.slice(i+1).trim()}:{k:'Detail',v:s}});
    if(id)Object.assign(prod(id),v);
    else db.products.unshift(Object.assign({id:uid('p'),r:0,rn:0,sold:0,kind:'phone',hue:Math.floor(Math.random()*360),added:new Date().toISOString()},v));
    save();closeModal();render();toast(id?'Item updated':'Item added to the store');return;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').firstChild)closeModal()});
window.addEventListener('hashchange',route);

/* ---------- start ---------- */
(async function(){
  db=loadDB();if(!db){db=await seed();save()}
  if(db.session&&db.session.role==='user'&&!user())db.session=null;
  route();
})();
})();
</script>
